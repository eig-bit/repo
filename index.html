<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8-bit</title>
    <!-- 引入 Google 復古 8-bit 字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #33ff33;
            --hover-bg: #33ff33;
            --hover-text: #000000;
            --border-color: #33ff33;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Press Start 2P', monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            font-size: clamp(1.5rem, 5vw, 3rem);
            margin-bottom: 40px;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px #005500;
        }

        h1::after {
            content: '_';
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: #111;
            border: 4px solid var(--border-color);
            padding: 20px;
            box-shadow: 8px 8px 0px #222;
        }

        .sys-msg {
            font-size: 0.8rem;
            line-height: 1.5;
            margin-bottom: 20px;
            color: #ccc;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            margin-bottom: 15px;
        }

        a {
            display: block;
            color: var(--text-color);
            text-decoration: none;
            padding: 15px;
            border: 2px dashed var(--border-color);
            font-size: clamp(0.7rem, 2.5vw, 1rem);
            word-break: break-all;
            transition: all 0.1s ease-in-out;
            text-transform: lowercase;
        }

        a:hover {
            background-color: var(--hover-bg);
            color: var(--hover-text);
            border-style: solid;
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px #222;
        }

        .error-msg {
            color: #ff3333;
            font-size: 0.8rem;
            line-height: 1.8;
            border: 2px solid #ff3333;
            padding: 15px;
        }

    </style>
</head>
<body>

    <h1>8-bit_</h1>

    <div class="container">
        <div class="sys-msg">
            > SCANNING CURRENT DIRECTORY...<br>
            > FILTERING .HTML FILES...
        </div>
        <ul id="file-list">
            <li class="sys-msg" id="loading-msg">> LOADING...</li>
        </ul>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const fileList = document.getElementById('file-list');
            const loadingMsg = document.getElementById('loading-msg');
            
            // 獲取當前網頁的檔名（用來排除自己）
            const currentPath = window.location.pathname;
            let currentFile = currentPath.split('/').pop();
            // 如果網址沒有特定檔名（例如 http://localhost:8080/），通常代表是 index.html
            if (!currentFile) currentFile = 'index.html'; 

            try {
                // 嘗試抓取當前目錄的內容（這需要 Web Server 支援並開啟 Directory Listing）
                const response = await fetch('./');
                if (!response.ok) {
                    throw new Error("SERVER_DENIED_DIRECTORY_LISTING");
                }

                const text = await response.text();
                
                // 將伺服器回傳的 HTML 內容解析為 DOM 物件
                const parser = new DOMParser();
                const doc = parser.parseFromString(text, 'text/html');
                
                // 找出所有超連結
                const links = Array.from(doc.querySelectorAll('a'));

                // 過濾出符合條件的 HTML 檔案
                let htmlFiles = links
                    .map(a => a.getAttribute('href'))
                    .filter(href => {
                        return href && 
                               href.toLowerCase().endsWith('.html') && // 必須是 .html
                               href !== currentFile &&                 // 排除自己
                               !href.includes('/') &&                  // 排除子目錄中的檔案
                               !href.startsWith('http');               // 排除外部連結
                    });

                // 移除陣列中重複的項目（以防伺服器回傳格式導致重複抓取）
                htmlFiles = [...new Set(htmlFiles)];

                // 清空載入中訊息
                fileList.innerHTML = '';

                if (htmlFiles.length === 0) {
                    fileList.innerHTML = '<li class="sys-msg">> NO OTHER HTML FILES DETECTED.</li>';
                } else {
                    htmlFiles.forEach(file => {
                        const li = document.createElement('li');
                        const a = document.createElement('a');
                        a.href = file;
                        a.textContent = `> ${file}`;
                        li.appendChild(a);
                        fileList.appendChild(li);
                    });
                }

            } catch (error) {
                console.error("Directory fetch error:", error);
                fileList.innerHTML = `
                    <div class="error-msg">
                        [ SYSTEM ERROR ]<br><br>
                        無法讀取目錄清單。<br><br>
                        原因：靜態單一檔案在本地端直接開啟 (file:///) 時，無法存取資料夾內容。<br><br>
                        解決方案：請將此檔案放於 Web Server (如 Live Server, Python http.server, PHP server) 運行。
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
