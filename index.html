<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8-bit</title>

<style>
:root{
    --bg:#0f172a;
    --card:#1e293b;
    --accent:#00ff99;
    --accent2:#00ccff;
    --text:#f8fafc;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: "Courier New", monospace;
    background:
        linear-gradient(
            rgba(255,255,255,.03) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.03) 1px,
            transparent 1px
        ),
        var(--bg);
    background-size:20px 20px;
    color:var(--text);
    min-height:100vh;
}

header{
    text-align:center;
    padding:48px 20px 24px;
}

h1{
    font-size:clamp(2.5rem,7vw,5rem);
    color:var(--accent);
    text-shadow:
        0 0 8px var(--accent),
        0 0 16px var(--accent);
}

.subtitle{
    margin-top:12px;
    color:#94a3b8;
}

.container{
    width:min(1100px,92%);
    margin:auto;
    padding-bottom:60px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:18px;
}

.card{
    background:var(--card);
    border:2px solid #334155;
    border-radius:12px;
    overflow:hidden;
    transition:.2s;
}

.card:hover{
    transform:translateY(-4px);
    border-color:var(--accent);
    box-shadow:0 0 18px rgba(0,255,153,.35);
}

.card a{
    display:block;
    padding:22px;
    text-decoration:none;
    color:inherit;
}

.card-title{
    color:var(--accent2);
    font-size:1.05rem;
    word-break:break-word;
}

.card-url{
    margin-top:10px;
    color:#94a3b8;
    font-size:.85rem;
}

.loading,
.empty,
.error{
    text-align:center;
    padding:50px 20px;
    color:#cbd5e1;
}

footer{
    text-align:center;
    color:#64748b;
    padding:30px 10px;
}
</style>
</head>
<body>

<header>
    <h1>8-bit</h1>
    <div class="subtitle">HTML Directory Explorer</div>
</header>

<div class="container">
    <div id="content" class="loading">
        載入中...
    </div>
</div>

<footer>
    Powered by GitHub REST API
</footer>

<script>
const content = document.getElementById("content");

async function loadFiles() {

    try {

        const pathParts = window.location.pathname
            .split("/")
            .filter(Boolean);

        const owner = window.location.hostname.split(".")[0];

        const repo = pathParts[0];

        if (!owner || !repo) {
            throw new Error("無法判斷 GitHub Repository");
        }

        const api =
            `https://api.github.com/repos/${owner}/${repo}/contents\`;

        const response = await fetch(api);

        if (!response.ok) {
            throw new Error("GitHub API 請求失敗");
        }

        const files = await response.json();

        const htmlFiles = files.filter(file =>
            file.type === "file" &&
            file.name.toLowerCase().endsWith(".html") &&
            file.name.toLowerCase() !== "index.html"
        );

        if (!htmlFiles.length) {
            content.className = "empty";
            content.innerHTML = "找不到其他 HTML 檔案";
            return;
        }

        const grid = document.createElement("div");
        grid.className = "grid";

        htmlFiles
            .sort((a,b)=>a.name.localeCompare(b.name))
            .forEach(file => {

                const card = document.createElement("div");
                card.className = "card";

                card.innerHTML = `
                    <a href="${file.name}">
                        <div class="card-title">
                            ${file.name.replace(/\.html$/i,'')}
                        </div>
                        <div class="card-url">
                            ${file.name}
                        </div>
                    </a>
                `;

                grid.appendChild(card);
            });

        content.className = "";
        content.innerHTML = "";
        content.appendChild(grid);

    } catch (err) {

        content.className = "error";
        content.innerHTML =
            "無法讀取 Repository 內容<br><br>" +
            err.message;

        console.error(err);
    }
}

loadFiles();
</script>

</body>
</html>
