<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8-bit</title>
    <!-- 引入 Google 復古 8-bit 字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #33ff33;
            --hover-bg: #33ff33;
            --hover-text: #000000;
            --border-color: #33ff33;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Press Start 2P', monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            font-size: clamp(1.5rem, 5vw, 3rem);
            margin-bottom: 40px;
            text-transform: uppercase;
            text-shadow: 2px 2px 0px #005500;
        }

        h1::after {
            content: '_';
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: #111;
            border: 4px solid var(--border-color);
            padding: 20px;
            box-shadow: 8px 8px 0px #222;
        }

        .sys-msg {
            font-size: 0.8rem;
            line-height: 1.5;
            margin-bottom: 20px;
            color: #ccc;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            margin-bottom: 15px;
        }

        a {
            display: block;
            color: var(--text-color);
            text-decoration: none;
            padding: 15px;
            border: 2px dashed var(--border-color);
            font-size: clamp(0.7rem, 2.5vw, 1rem);
            word-break: break-all;
            transition: all 0.1s ease-in-out;
            text-transform: lowercase;
        }

        a:hover {
            background-color: var(--hover-bg);
            color: var(--hover-text);
            border-style: solid;
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0px #222;
        }

        .error-msg {
            color: #ff3333;
            font-size: 0.8rem;
            line-height: 1.8;
            border: 2px solid #ff3333;
            padding: 15px;
        }
    </style>
</head>
<body>

    <h1>8-bit_</h1>

    <div class="container">
        <div class="sys-msg">
            > CONNECTING TO GITHUB API...<br>
            > FETCHING REPOSITORY CONTENTS...
        </div>
        <ul id="file-list">
            <li class="sys-msg" id="loading-msg">> LOADING...</li>
        </ul>
    </div>

    <script>
        // ==========================================
        // 設定區（選填）
        // 如果網頁使用了自訂網域 (Custom Domain)，請手動填寫以下兩個值：
        const MANUAL_CONFIG = {
            owner: "", // 例如 "your-github-username"
            repo: ""   // 例如 "your-repo-name"
        };
        // ==========================================

        document.addEventListener("DOMContentLoaded", async () => {
            const fileList = document.getElementById('file-list');

            // 1. 取得當前網頁檔名（用於過濾排除自己）
            const currentPath = window.location.pathname;
            let currentFile = currentPath.split('/').pop().toLowerCase();
            if (!currentFile || !currentFile.endsWith('.html')) {
                currentFile = 'index.html';
            }

            // 2. 自動判斷 GitHub 帳號與 Repository 名稱
            let owner = MANUAL_CONFIG.owner;
            let repo = MANUAL_CONFIG.repo;

            if (!owner || !repo) {
                const host = window.location.hostname; // 例如 username.github.io
                const pathSegments = currentPath.split('/').filter(p => p && !p.endsWith('.html'));

                if (host.endsWith('.github.io')) {
                    owner = host.split('.')[0];
                    // 如果網址是 username.github.io/repo-name/，repo 就是第一個路徑片段
                    // 如果網址是 username.github.io/，repo 名稱預設就是 username.github.io
                    repo = pathSegments[0] || `${owner}.github.io`;
                }
            }

            // 如果無法判斷，顯示提示
            if (!owner || !repo) {
                showError("無法自動識別 GitHub 儲存庫。<br>請在程式碼內的 MANUAL_CONFIG 填入你的 GitHub 帳號與 Repo 名稱。");
                return;
            }

            try {
                // 3. 呼叫 GitHub API 抓取檔案列表
                const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/`;
                const response = await fetch(apiUrl);

                if (!response.ok) {
                    throw new Error(`GitHub API 回傳錯誤 (${response.status})`);
                }

                const data = await response.json();

                // 4. 過濾出 .html 檔案且排除自己
                const htmlFiles = data
                    .filter(item => 
                        item.type === 'file' && 
                        item.name.toLowerCase().endsWith('.html') && 
                        item.name.toLowerCase() !== currentFile
                    )
                    .map(item => item.name);

                // 5. 渲染列表
                fileList.innerHTML = '';

                if (htmlFiles.length === 0) {
                    fileList.innerHTML = '<li class="sys-msg">> NO OTHER HTML FILES DETECTED.</li>';
                } else {
                    htmlFiles.forEach(file => {
                        const li = document.createElement('li');
                        const a = document.createElement('a');
                        a.href = file;
                        a.textContent = `> ${file}`;
                        li.appendChild(a);
                        fileList.appendChild(li);
                    });
                }

            } catch (error) {
                console.error("GitHub API Error:", error);
                showError(`無法讀取 GitHub 目錄清單。<br><br>錯誤訊息: ${error.message}`);
            }

            function showError(msg) {
                fileList.innerHTML = `
                    <div class="error-msg">
                        [ SYSTEM ERROR ]<br><br>
                        ${msg}
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
