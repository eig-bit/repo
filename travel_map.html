<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🗺️ PIXEL TOUR - 8-bit 旅遊地圖</title>

<!-- ============================================
     技術說明：
     - 單檔案 PWA：manifest 用 Blob URL 動態注入
     - Leaflet.js + MarkerCluster（CDN）
     - IndexedDB：spots 表 + categories 表
     - 分類管理：CRUD + 景點轉移 + 排序 + 換色
     - Geolocation 定位：一次性高精度 + 誤差圈
     - 8-bit 像素風：Press Start 2P + pixelated
     - v3.1 修正：頂欄 flex-wrap，手機按鈕不再溢出
============================================ -->

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

<style>
:root {
  --bg: #1a1c2c; --panel: #29366f; --accent: #41a6f6;
  --green: #38b764; --yellow: #ffcd75; --red: #b13e53;
  --text: #f4f4f4; --shadow: #0d0d1a;
  --border: 4px solid #0d0d1a;
}
* { box-sizing: border-box; margin: 0; padding: 0; image-rendering: pixelated; }
body {
  font-family: 'Press Start 2P', 'Courier New', monospace;
  background: var(--bg); color: var(--text);
  font-size: 10px; line-height: 1.8; overflow: hidden;
  /* 【v3.1 修正】body 改為垂直 flex 佈局：
     頂欄高度自適應（可換行成兩行），地圖區域自動填滿剩餘空間 */
  display: flex; flex-direction: column;
  height: 100dvh;
}

/* ===== 頂部工具列 =====
   【v3.1 修正】
   - flex-wrap: wrap → 按鈕放不下時自動換到第二行
   - 移除固定 height: 56px → 改 min-height，高度隨內容伸縮
   - 如此「匯入」等按鈕在任何螢幕寬度都完整可見 */
#topbar {
  min-height: 56px;
  background: var(--panel); border-bottom: var(--border);
  display: flex; flex-wrap: wrap; align-items: center;
  gap: 6px; padding: 8px 12px;
  z-index: 1000; position: relative;
}
#topbar h1 { font-size: 12px; color: var(--yellow); text-shadow: 3px 3px 0 var(--shadow); white-space: nowrap; }
.btn {
  font-family: inherit; font-size: 9px; background: var(--accent); color: #fff;
  border: var(--border); padding: 8px 10px; cursor: pointer;
  box-shadow: inset -3px -3px 0 rgba(0,0,0,.3), inset 3px 3px 0 rgba(255,255,255,.3);
  text-transform: uppercase; white-space: nowrap;
}
.btn:active { transform: translate(2px,2px); box-shadow: none; }
.btn.green { background: var(--green); } .btn.red { background: var(--red); }
.btn.yellow { background: var(--yellow); color: #333; }
.btn.small { font-size: 8px; padding: 5px 7px; }

/* 【v3.1 修正】#main 用 flex:1 自動填滿頂欄以下空間，
   不再用 calc(100dvh - 56px)（頂欄高度現在是動態的） */
#main { display: flex; flex: 1; min-height: 0; position: relative; }
#sidebar {
  width: 320px; background: var(--panel); border-right: var(--border);
  display: flex; flex-direction: column; z-index: 900;
}
#filters { padding: 10px; display: flex; flex-wrap: wrap; gap: 6px; border-bottom: var(--border); }
.chip {
  font-family: inherit; font-size: 8px; cursor: pointer;
  background: #3b5dc9; color: #fff; border: 3px solid var(--shadow);
  padding: 5px 8px; display: inline-flex; align-items: center; gap: 5px;
}

.chip.active { background: var(--yellow); color: #333; }
#spot-list { flex: 1; overflow-y: auto; padding: 10px; }

.spot-item {

.spot-item .del { float: right; font-size: 8px; background: var(--red); border: 2px solid var(--shadow);

#map { flex: 1; background: #0d0d1a; }
#map .leaflet-tile { image-rendering: pixelated; }
.leaflet-popup-content-wrapper {
  border-radius: 0 !important; border: var(--border) !important;
  font-family: 'Press Start 2P', monospace !important;
  background: var(--panel) !important; color: var(--text) !important;
}
.leaflet-popup-content { font-size: 9px; line-height: 1.8; margin: 12px !important; }
.leaflet-popup-content b { color: var(--yellow); }
.leaflet-bar a {
  border-radius: 0 !important; border: 3px solid var(--shadow) !important;
  background: var(--accent) !important; color: #fff !important;
  font-family: 'Press Start 2P', monospace !important;
}
.pixel-marker {
  width: 20px; height: 20px; border: 3px solid #0d0d1a;
  box-shadow: inset -3px -3px 0 rgba(0,0,0,.4), inset 3px 3px 0 rgba(255,255,255,.4);
}

/* ===== 定位標記：脈衝光環動畫 ===== */
.loc-marker {
  width: 18px; height: 18px;
  background: #41a6f6;
  border: 3px solid #f4f4f4;
  outline: 3px solid #0d0d1a;
  border-radius: 50%;
  position: relative;
}
.loc-marker::after {
  content: '';
  position: absolute;
  inset: -14px;
  border: 3px solid rgba(65, 166, 246, .8);
  border-radius: 50%;
  animation: pulse 1.2s steps(8) infinite;
}
@keyframes pulse {
  0%   { transform: scale(0.4); opacity: 1; }
  100% { transform: scale(1.4); opacity: 0; }
}
#btn-locate.loading { animation: blink .5s steps(2) infinite; }
@keyframes blink { 50% { background: #ef7d57; } }

dialog {
  font-family: inherit; background: var(--panel); color: var(--text);
  border: var(--border); box-shadow: 8px 8px 0 var(--shadow);
  padding: 20px; width: min(440px, 92vw);
}
dialog::backdrop { background: rgba(0,0,0,.7); }
dialog h2 { color: var(--yellow); font-size: 12px; margin-bottom: 16px; }
label { display: block; font-size: 8px; margin: 12px 0 4px; color: #a7c4f0; }
input, textarea, select {
  font-family: inherit; font-size: 9px; width: 100%;
  background: #1a1c2c; color: var(--text);
  border: 3px solid var(--shadow); padding: 8px;
}
textarea { height: 70px; resize: vertical; }
dialog .row { display: flex; gap: 10px; margin-top: 18px; justify-content: flex-end; }

/* ===== 分類管理介面 ===== */
#cat-list { max-height: 340px; overflow-y: auto; margin-top: 4px; }
#cat-list::-webkit-scrollbar { width: 10px; }
#cat-list::-webkit-scrollbar-thumb { background: var(--accent); }
.cat-row {

  background: #3b5dc9; border: 3px solid var(--shadow);

.cat-row .dot { width: 16px; height: 16px; border: 3px solid var(--shadow); flex-shrink: 0; cursor: pointer; }
.cat-row .name { flex: 1; font-size: 9px; overflow: hidden; text-overflow: ellipsis; }
.cat-row .count { font-size: 7px; color: #a7c4f0; }
.cat-row button {

}
.cat-row button.mv { background: #3b5dc9; }
.cat-row button.edit { background: var(--yellow); color: #333; }
.cat-row button.del { background: var(--red); }
#cat-new-row { display: flex; gap: 6px; margin-top: 12px; align-items: center; }
#cat-new-row input[type="text"] { flex: 1; }
#palette {
  position: fixed; background: var(--panel); border: var(--border);
  box-shadow: 6px 6px 0 var(--shadow); padding: 10px; z-index: 4000;
  display: none; grid-template-columns: repeat(5, 1fr); gap: 6px;
}
#palette .sw { width: 26px; height: 26px; border: 3px solid var(--shadow); cursor: pointer; }
#palette .sw:hover { transform: scale(1.15); }

#toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--green); color: #fff; border: var(--border);
  padding: 12px 16px; font-size: 9px; z-index: 2000;
  box-shadow: 4px 4px 0 var(--shadow); display: none;
}
#a2hs-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--yellow); color: #333; border-top: var(--border);
  padding: 12px; font-size: 9px; display: none; align-items: center; gap: 10px;

#a2hs-bar button { flex-shrink: 0; }
#importFile { display: none; }

#sidebar-toggle { display: none; }

/* ============================================
   【v3.1 修正】手機版響應式
   - 按鈕縮小（字體 7px、padding 緊湊、gap 4px）
   - 標題縮小並允許在按鈕換行後佔用較少空間
   - 頂欄可換行 → 所有按鈕（含匯入）必完整可見
   - 側欄抽屜：top: 0（相對於 #main，因 #main 加了 position:relative）
============================================ */
@media (max-width: 768px) {
  #sidebar-toggle { display: block; }
  #sidebar {
    position: absolute; left: -324px; width: 320px; top: 0; bottom: 0;
    transition: left .15s steps(4);

  #topbar { padding: 6px 8px; gap: 4px; }
  #topbar h1 { font-size: 9px; }
  body { font-size: 9px; }

  #topbar h1 { order: -1; }
}
/* 極窄螢幕（<360px）：標題縮為僅圖示感 */
@media (max-width: 360px) {
  #topbar h1 { font-size: 8px; }
  #topbar .btn { font-size: 7px; padding: 5px 4px; }

<script>
/* ============================================================
   PIXEL TOUR v3.1 — 架構總覽
   ├─ IndexedDB：「spots」與「categories」兩張表
   ├─ 分類系統：動態 CRUD + 換色 + 排序 + 景點轉移
   ├─ Geolocation：一次性高精度定位 + 誤差圈 + 脈衝標記
   ├─ JSON 匯入/匯出：含分類資料一併備份
   ├─ 單檔案 PWA：Blob manifest + canvas 8-bit 圖示 + A2HS
   └─ v3.1：頂欄 flex-wrap 修正手機按鈕溢出
   ============================================================ */

/* ------------------------------------------------------------
   IndexedDB（Promise 封裝）
------------------------------------------------------------ */
const DB_NAME = 'pixel-tour-db', DB_VER = 2;
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('spots')) {
        const s = db.createObjectStore('spots', { keyPath: 'id', autoIncrement: true });
        s.createIndex('cat', 'cat', { unique: false });
      }
      if (!db.objectStoreNames.contains('categories')) {
        db.createObjectStore('categories', { keyPath: 'key' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror  = () => reject(req.error);
  });
}
function tx(store, mode, fn) {
  return openDB().then(db => new Promise((res, rej) => {
    const t = db.transaction(store, mode);
    const rq = fn(t.objectStore(store));
    rq.onsuccess = () => res(rq.result);
    rq.onerror  = () => rej(rq.error);
  }));
}
const dbSpots = {
  all:    () => tx('spots', 'readonly',  s => s.getAll()),
  put:    d  => tx('spots', 'readwrite', s => s.put(d)),
  del:    id => tx('spots', 'readwrite', s => s.delete(id)),
};
const dbCats = {
  all:    () => tx('categories', 'readonly',  s => s.getAll()),
  put:    c  => tx('categories', 'readwrite', s => s.put(c)),
  del:    k  => tx('categories', 'readwrite', s => s.delete(k)),
};

/* ------------------------------------------------------------
   預設分類（11 種）與色板
------------------------------------------------------------ */
const PALETTE = ['#ffcd75','#38b764','#b13e53','#41a6f6','#ef7d57',
                 '#a7c4f0','#ff7ab6','#73eff7','#8b6ff0','#94b0c2','#5d275d'];
const DEFAULT_CATS = [
  { key: 'history', name: '🏰 歷史古蹟', color: '#ffcd75' },
  { key: 'nature',  name: '🌲 自然風光', color: '#38b764' },
  { key: 'food',    name: '🍜 美食',     color: '#b13e53' },
  { key: 'shopping',name: '🛍️ 購物',     color: '#ef7d57' },
  { key: 'theme',   name: '🎡 主題樂園', color: '#ff7ab6' },
  { key: 'airport', name: '✈️ 機場',     color: '#a7c4f0' },
  { key: 'religion',name: '⛩️ 宗教',     color: '#8b6ff0' },
  { key: 'venue',   name: '🏛️ 場館',     color: '#73eff7' },
  { key: 'entmt',   name: '🎭 娛樂',     color: '#94b0c2' },
  { key: 'night',   name: '🌙 夜生活',   color: '#5d275d' },
  { key: 'other',   name: '📍 其他',     color: '#41a6f6' },
];

/* ------------------------------------------------------------
   持久化儲存申請
------------------------------------------------------------ */
async function requestPersistence() {
  if (navigator.storage && navigator.storage.persist) {
    if (await navigator.storage.persisted()) return;
    const granted = await navigator.storage.persist();
    if (granted) toast('✅ 已取得持久化儲存權限！');
    if (navigator.storage.estimate) {
      const { usage, quota } = await navigator.storage.estimate();
      console.info(`儲存用量：${(usage/1024).toFixed(1)}KB / ${(quota/1048576).toFixed(0)}MB`);
    }
  }
}

/* ------------------------------------------------------------
   單檔案 PWA：canvas 繪 8-bit 圖示 + Blob manifest
------------------------------------------------------------ */
function makePixelIcon(size) {
  const px = 8, c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const art = ['DDDDDDDD','DWWWWWD','DWJJJJWD','DWJJJJWD',
               'DWJJJJWD','DDWJJWDD','DDDWJWDD','DDDDWDDD'];
  const colors = { D:'#0d0d1a', J:'#ffcd75', W:'#f4f4f4' };
  art.forEach((row, y) => [...row].forEach((ch, x) => {
    ctx.fillStyle = colors[ch];
    ctx.fillRect(x*size/px, y*size/px, size/px+0.5, size/px+0.5);
  }));
  return c.toDataURL('image/png');
}
(function injectManifest() {
  const manifest = {
    name: 'Pixel Tour - 8bit 旅遊地圖', short_name: 'PixelTour',
    start_url: '.', display: 'standalone',
    background_color: '#1a1c2c', theme_color: '#29366f',
    icons: [
      { src: makePixelIcon(192), sizes: '192x192', type: 'image/png' },
      { src: makePixelIcon(512), sizes: '512x512', type: 'image/png' }
    ]
  };
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/json' }));
  document.head.appendChild(link);
})();

/* ------------------------------------------------------------
   A2HS - Add to Home Screen
------------------------------------------------------------ */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredPrompt = e;
  document.getElementById('a2hs-bar').style.display = 'flex';
});
document.getElementById('a2hs-install').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  toast(outcome === 'accepted' ? '🎉 安裝成功！' : '已取消安裝');
  deferredPrompt = null; hideA2HS();
});
document.getElementById('a2hs-close').addEventListener('click', hideA2HS);
function hideA2HS() { document.getElementById('a2hs-bar').style.display = 'none'; }
window.addEventListener('appinstalled', () => { hideA2HS(); toast('🎉 感謝安裝！'); });
if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !window.matchMedia('(display-mode: standalone)').matches) {
  const bar = document.getElementById('a2hs-bar');
  bar.querySelector('span').textContent = '📲 iOS：點 Safari「分享」→「加入主畫面」';
  bar.style.display = 'flex';
  document.getElementById('a2hs-install').style.display = 'none';
}

/* ------------------------------------------------------------
   地圖初始化
------------------------------------------------------------ */
const map = L.map('map').setView([23.7, 121], 7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '© OpenStreetMap'
}).addTo(map);
const markerGroup = L.markerClusterGroup({ maxClusterRadius: 40 });
map.addLayer(markerGroup);

// 【v3.1】頂欄可換行後高度會變，需通知 Leaflet 重新計算地圖尺寸
new ResizeObserver(() => map.invalidateSize()).observe(document.body);

/* ------------------------------------------------------------
   應用狀態
------------------------------------------------------------ */
let spots = [], cats = [], activeFilter = 'all', editingId = null;
const markers = new Map();
const catMap = () => Object.fromEntries(cats.map(c => [c.key, c]));

function makeIcon(cat) {
  const c = catMap()[cat];
  return L.divIcon({
    className: '',
    html: `<div class="pixel-marker" style="background:${c ? c.color : '#41a6f6'}"></div>`,
    iconSize: [20, 20], iconAnchor: [10, 10], popupAnchor: [0, -12]
  });
}

/* ---------- 渲染：景點列表 ---------- */
function renderList() {
  const cm = catMap();
  const list = document.getElementById('spot-list');
  const filtered = activeFilter === 'all' ? spots : spots.filter(s => s.cat === activeFilter);
  list.innerHTML = filtered.length ? '' :
    '<p style="padding:20px;color:#a7c4f0;text-align:center">— 沒有景點 —<br><br>點地圖或按「+新增」<br>開始冒險吧！</p>';
  filtered.forEach(s => {
    const c = cm[s.cat];
    const div = document.createElement('div');
    div.className = 'spot-item'; div.dataset.id = s.id;
    div.innerHTML = `<button class="del" title="刪除">✕</button>
      <h3>${escapeHtml(s.name)}</h3>
      <span class="cat">${c ? `<span class="dot" style="background:${c.color}"></span>${escapeHtml(c.name)}` : '⚠️ 未知分類'}</span>`;
    div.addEventListener('click', e => {
      if (e.target.classList.contains('del')) return;
      flyToSpot(s.id);
      if (innerWidth <= 768) sidebar.classList.remove('open');
    });
    div.querySelector('.del').addEventListener('click', async e => {
      e.stopPropagation();
      if (confirm(`刪除「${s.name}」？`)) { await dbSpots.del(s.id); loadAll(); toast('🗑️ 已刪除'); }
    });
    list.appendChild(div);
  });
}

/* ---------- 渲染：地圖標記 ---------- */
function renderMarkers() {
  const cm = catMap();
  markerGroup.clearLayers(); markers.clear();
  const filtered = activeFilter === 'all' ? spots : spots.filter(s => s.cat === activeFilter);
  filtered.forEach(s => {
    const c = cm[s.cat];
    const m = L.marker([s.lat, s.lng], { icon: makeIcon(s.cat) })
      .bindPopup(`<b>${escapeHtml(s.name)}</b><br>${c ? escapeHtml(c.name) : ''}<br>
        ${escapeHtml(s.desc || '')}<br>
        <a href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}"
           target="_blank" style="color:#ffcd75">🧭 導航前往 »</a>`);
    markerGroup.addLayer(m);
    markers.set(s.id, m);
  });
}

/* ---------- 渲染：篩選器 ---------- */
function renderFilters() {
  const box = document.getElementById('filters');
  box.innerHTML = '';
  const mk = (key, label, color) => {
    const b = document.createElement('button');
    b.className = 'chip' + (activeFilter === key ? ' active' : '');
    b.innerHTML = color ? `<span class="dot" style="background:${color}"></span>${label}` : label;
    b.onclick = () => { activeFilter = key; renderFilters(); renderList(); renderMarkers(); };
    box.appendChild(b);
  };
  mk('all', '★ 全部');
  cats.forEach(c => mk(c.key, c.name, c.color));
}

/* ---------- 渲染：景點表單下拉 ---------- */
function renderCatSelect(sel) {
  const el = document.getElementById('f-cat');
  el.innerHTML = '';
  cats.forEach(c => {
    const o = document.createElement('option');
    o.value = c.key; o.textContent = c.name;
    el.appendChild(o);
  });
  if (sel) el.value = sel;
}

function flyToSpot(id) {
  const s = spots.find(x => x.id === id);
  if (!s) return;
  map.flyTo([s.lat, s.lng], Math.max(map.getZoom(), 14), { duration: 0.5 });
  setTimeout(() => {
    const m = markers.get(id);
    if (m) m.openPopup();
    document.querySelectorAll('.spot-item').forEach(el =>
      el.classList.toggle('active', +el.dataset.id === id));
    const a = document.querySelector('.spot-item.active');
    if (a) a.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }, 550);
}

async function loadAll() {
  spots = (await dbSpots.all()).sort((a, b) => a.name.localeCompare(b.name, 'zh-Hant'));
  renderList(); renderMarkers();
}
async function loadCats() {
  cats = (await dbCats.all()).sort((a, b) => (a.sort ?? 0) - (b.sort ?? 0));
  renderFilters(); renderCatSelect(); renderCatManager();
}

/* ------------------------------------------------------------
   新增 / 編輯景點
------------------------------------------------------------ */
const dlg = document.getElementById('dlg');
document.getElementById('btn-add').addEventListener('click', () => openDialog(null));
map.on('click', e => openDialog(null, e.latlng));
map.on('contextmenu', e => openDialog(null, e.latlng));

function openDialog(id, latlng) {
  editingId = id;
  const s = id ? spots.find(x => x.id === id) : null;
  document.getElementById('dlg-title').textContent = s ? '✏️ 編輯景點' : '⚔️ 新增景點';
  document.getElementById('f-name').value = s?.name || '';
  renderCatSelect(s?.cat);
  document.getElementById('f-lat').value = s?.lat ?? latlng?.lat ?? '';
  document.getElementById('f-lng').value = s?.lng ?? latlng?.lng ?? '';
  document.getElementById('f-desc').value = s?.desc || '';
  dlg.showModal();
}
document.getElementById('dlg-cancel').onclick = () => dlg.close();
document.getElementById('spot-form').addEventListener('submit', async e => {
  e.preventDefault();
  const data = {
    name: document.getElementById('f-name').value.trim(),
    cat:  document.getElementById('f-cat').value,
    lat:  +document.getElementById('f-lat').value,
    lng:  +document.getElementById('f-lng').value,
    desc: document.getElementById('f-desc').value.trim()
  };
  if (editingId) data.id = editingId;
  await dbSpots.put(data);
  dlg.close(); await loadAll(); toast('💾 已儲存！');
});

/* ============================================================
   分類管理
============================================================ */
const catDlg = document.getElementById('cat-dlg');
document.getElementById('btn-cats').addEventListener('click', () => { renderCatManager(); catDlg.showModal(); });
document.getElementById('cat-close').onclick = () => catDlg.close();

function makeCatKey(name) {
  let base = 'cat-' + encodeURIComponent(name).replace(/[^a-zA-Z0-9%-]/g, '').slice(0, 20)
             || 'cat';
  if (!cats.some(c => c.key === base)) return base;
  let i = 2;
  while (cats.some(c => c.key === `${base}-${i}`)) i++;
  return `${base}-${i}`;
}

function renderCatManager() {
  const counts = {};
  spots.forEach(s => counts[s.cat] = (counts[s.cat] || 0) + 1);
  const box = document.getElementById('cat-list');
  box.innerHTML = '';
  cats.forEach((c, i) => {
    const row = document.createElement('div');
    row.className = 'cat-row';
    row.innerHTML = `
      <div class="dot" style="background:${c.color}" title="點擊換色"></div>
      <span class="name">${escapeHtml(c.name)}</span>
      <span class="count">${counts[c.key] || 0} 處</span>
      <button class="mv" data-act="up" ${i === 0 ? 'disabled' : ''}>▲</button>
      <button class="mv" data-act="down" ${i === cats.length-1 ? 'disabled' : ''}>▼</button>
      <button class="edit" data-act="edit">✏️</button>
      <button class="del" data-act="del" ${c.key === 'other' ? 'disabled title="保底分類不可刪"' : ''}>✕</button>`;
    row.querySelector('.dot').addEventListener('click', e => openPalette(e.target, c));
    row.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
      const act = btn.dataset.act;
      if (act === 'up' || act === 'down') moveCat(i, act === 'up' ? i-1 : i+1);
      else if (act === 'edit') editCat(c);
      else if (act === 'del') deleteCat(c, counts[c.key] || 0);
    }));
    box.appendChild(row);
  });
}

document.getElementById('cat-new-add').addEventListener('click', async () => {
  const input = document.getElementById('cat-new-name');
  const name = input.value.trim();
  if (!name) { toast('請輸入分類名稱'); return; }
  if (cats.some(c => c.name === name)) { toast('❌ 名稱重複'); return; }
  await dbCats.put({ key: makeCatKey(name), name, color: PALETTE[cats.length % PALETTE.length], sort: cats.length });
  input.value = '';
  await loadCats(); renderList(); renderMarkers();
  toast('🏷️ 已新增分類');
});
document.getElementById('cat-new-name').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); document.getElementById('cat-new-add').click(); }
});

async function editCat(c) {
  const name = prompt('新名稱：', c.name);
  if (!name || name.trim() === c.name) return;
  if (cats.some(x => x.name === name.trim() && x.key !== c.key)) { toast('❌ 名稱重複'); return; }
  await dbCats.put({ ...c, name: name.trim() });
  await loadCats(); renderList(); renderMarkers();
  toast('✏️ 已更新');
}

async function deleteCat(c, count) {
  if (count > 0) {
    const others = cats.filter(x => x.key !== c.key);
    let msg = `分類「${c.name}」下有 ${count} 個景點。\n轉移到哪個分類？\n\n`;
    others.forEach((o, i) => msg += `${i+1}. ${o.name}\n`);
    const ans = prompt(msg);
    if (ans === null) return;
    const target = others[+ans - 1] || others.find(o => o.key === 'other') || others[0];
    if (!target) { toast('❌ 沒有可轉移的分類'); return; }
    for (const s of spots.filter(s => s.cat === c.key)) {
      await dbSpots.put({ ...s, cat: target.key });
    }
    toast(`📦 已轉移至「${target.name}」`);
  } else if (!confirm(`刪除分類「${c.name}」？`)) return;
  await dbCats.del(c.key);
  if (activeFilter === c.key) activeFilter = 'all';
  await loadCats(); await loadAll();
  toast('🗑️ 已刪除分類');
}

async function moveCat(from, to) {
  if (to < 0 || to >= cats.length) return;
  const arr = [...cats];
  [arr[from], arr[to]] = [arr[to], arr[from]];
  for (let i = 0; i < arr.length; i++) await dbCats.put({ ...arr[i], sort: i });
  await loadCats();
}

/* ---------- 像素色板（換色用） ---------- */
const palette = document.createElement('div');
palette.id = 'palette';
document.body.appendChild(palette);
let paletteTarget = null;
function openPalette(dotEl, cat) {
  paletteTarget = cat;
  palette.innerHTML = '';
  PALETTE.forEach(color => {
    const sw = document.createElement('div');
    sw.className = 'sw'; sw.style.background = color;
    sw.onclick = async () => {
      await dbCats.put({ ...paletteTarget, color });
      palette.style.display = 'none';
      await loadCats(); renderList(); renderMarkers();
      toast('🎨 已換色');
    };
    palette.appendChild(sw);
  });
  const r = dotEl.getBoundingClientRect();
  palette.style.display = 'grid';
  palette.style.left = Math.min(r.left, innerWidth - 190) + 'px';
  palette.style.top  = Math.max(10, r.bottom + 6) + 'px';
}
document.addEventListener('click', e => {
  if (!palette.contains(e.target) && !e.target.classList.contains('dot'))
    palette.style.display = 'none';
});

/* ============================================================
   【定位功能】
   navigator.geolocation.getCurrentPosition（一次性、省電）
   - accuracy（公尺）畫成半透明誤差圈
   - 三種失敗情境分別提示
   - 僅在 https:// 或 localhost 可用（GitHub Pages OK）
============================================================ */
const btnLocate = document.getElementById('btn-locate');
let locMarker = null;
let locCircle = null;

btnLocate.addEventListener('click', () => {
  if (!navigator.geolocation) {
    toast('❌ 此瀏覽器不支援定位');
    return;
  }
  btnLocate.classList.add('loading');
  btnLocate.textContent = '⏳ 定位中';

  navigator.geolocation.getCurrentPosition(
    pos => {
      btnLocate.classList.remove('loading');
      btnLocate.textContent = '📍 定位';
      const { latitude, longitude, accuracy } = pos.coords;

      if (locMarker) map.removeLayer(locMarker);
      if (locCircle) map.removeLayer(locCircle);

      locMarker = L.marker([latitude, longitude], {
        icon: L.divIcon({
          className: '',
          html: '<div class="loc-marker"></div>',
          iconSize: [18, 18], iconAnchor: [9, 9]
        }),
        zIndexOffset: 1000
      }).addTo(map).bindPopup('<b>📍 你在這裡</b><br>誤差約 ' + Math.round(accuracy) + ' 公尺');

      locCircle = L.circle([latitude, longitude], {
        radius: accuracy,
        color: '#41a6f6', weight: 3,
        fillColor: '#41a6f6', fillOpacity: 0.15
      }).addTo(map);

      map.flyTo([latitude, longitude], 16, { duration: 0.6 });
      setTimeout(() => locMarker.openPopup(), 650);
      toast('📍 定位成功！');
    },
    err => {
      btnLocate.classList.remove('loading');
      btnLocate.textContent = '📍 定位';
      const msgs = {
        1: '❌ 定位權限被拒絕，請至瀏覽器設定開啟',
        2: '❌ 取不到位置訊號，請到空曠處再試',
        3: '❌ 定位逾時，請再試一次'
      };
      toast(msgs[err.code] || '❌ 定位失敗');
    },
    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 30000
    }
  );
});

/* ------------------------------------------------------------
   JSON 匯入/匯出（含分類一併備份）
------------------------------------------------------------ */
document.getElementById('btn-export').addEventListener('click', async () => {
  const data = {
    app: 'pixel-tour', version: 2,
    exportedAt: new Date().toISOString(),
    categories: await dbCats.all(),
    spots: await dbSpots.all()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `pixel-tour-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('📤 匯出成功！');
});

document.getElementById('btn-import').addEventListener('click', () =>
  document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data.spots)) throw new Error('格式錯誤');
      if (Array.isArray(data.categories)) {
        for (const c of data.categories) {
          if (c.key && c.name) await dbCats.put({
            key: c.key, name: String(c.name),
            color: /^#[0-9a-fA-F]{6}$/.test(c.color) ? c.color : '#41a6f6',
            sort: +c.sort || 99
          });
        }
      }
      if (!confirm(`匯入 ${data.spots.length} 筆資料？（將與現有資料合併）`)) { e.target.value=''; return; }
      for (const s of data.spots) {
        if (s.name && isFinite(s.lat) && isFinite(s.lng) &&
            Math.abs(s.lat) <= 90 && Math.abs(s.lng) <= 180) {
          await dbSpots.put({ name: String(s.name),
            cat: cats.some(c => c.key === s.cat) ? s.cat : 'other',
            lat: +s.lat, lng: +s.lng, desc: s.desc || '' });
        }
      }
      await loadCats(); await loadAll();
      toast('📥 匯入成功！');
    } catch { toast('❌ 匯入失敗：檔案格式錯誤'); }
    e.target.value = '';
  };
  reader.readAsText(file);
});

/* ------------------------------------------------------------
   工具函式 / 側欄
------------------------------------------------------------ */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.style.display = 'none', 2500);
}
const sidebar = document.getElementById('sidebar');
document.getElementById('sidebar-toggle').addEventListener('click', () =>
  sidebar.classList.toggle('open'));

/* ------------------------------------------------------------
   首次啟動：寫入預設分類 + 台北示範景點
------------------------------------------------------------ */
async function seedIfEmpty() {
  if ((await dbCats.all()).length === 0) {
    for (let i = 0; i < DEFAULT_CATS.length; i++)
      await dbCats.put({ ...DEFAULT_CATS[i], sort: i });
    cats = DEFAULT_CATS.map((c, i) => ({ ...c, sort: i }));
  }
  if ((await dbSpots.all()).length === 0) {
    const demo = [
      { name: '台北 101', cat: 'entmt',   lat: 25.0338, lng: 121.5645, desc: '曾是世界第一高樓，觀景台可俯瞰台北。' },
      { name: '故宮博物院', cat: 'venue',   lat: 25.1024, lng: 121.5485, desc: '收藏中華文化瑰寶，翠玉白菜必看！' },
      { name: '士林夜市', cat: 'food',    lat: 25.0884, lng: 121.5250, desc: '豪大雞排、蚵仔煎、珍珠奶茶。' },
      { name: '陽明山國家公園', cat: 'nature', lat: 25.1683, lng: 121.5583, desc: '火山地形、溫泉、春季花季。' },
      { name: '龍山寺', cat: 'religion', lat: 25.0369, lng: 121.4999, desc: '台北最古老的廟宇之一。' },
      { name: '象山步道', cat: 'nature',  lat: 25.0287, lng: 121.5795, desc: '近距離拍攝 101 的絕佳地點。' },
      { name: '信義商圈', cat: 'shopping',lat: 25.0324, lng: 121.5645, desc: '百貨一級戰區。' },
      { name: '桃園國際機場', cat: 'airport', lat: 25.0777, lng: 121.2328, desc: 'TPE，出發冒險的起點！' },
      { name: '西門町', cat: 'night',   lat: 25.0422, lng: 121.5063, desc: '夜生活與街頭文化聖地。' }

(async function init() {
  await seedIfEmpty();
  await loadCats();
  await loadAll();
  await requestPersistence();
  toast('🎮 歡迎來到 PIXEL TOUR！');
})();
</script>
