<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8-BIT TRAVEL MAP</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0f23; --panel:#1e1e3f; --panel2:#2a2a55;
  --ink:#e8e8ff; --yellow:#ffd93d; --green:#4ade80;
  --red:#ff5c5c; --cyan:#5ce1e6; --mag:#ff6ec7;
  --border:#000;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Press Start 2P',monospace;background:var(--bg);color:var(--ink);font-size:11px;line-height:1.7;overflow:hidden}
button{font-family:inherit;font-size:10px;cursor:pointer;background:var(--panel2);color:var(--ink);border:3px solid var(--border);padding:8px 10px;box-shadow:3px 3px 0 var(--border);text-transform:uppercase}
button:active{transform:translate(3px,3px);box-shadow:none}
button.primary{background:var(--yellow);color:#000}
button.danger{background:var(--red);color:#000}
input,select,textarea{font-family:inherit;font-size:10px;background:var(--bg);color:var(--ink);border:3px solid var(--border);padding:8px;width:100%;margin-bottom:8px}
input:focus,select:focus,textarea:focus{outline:3px solid var(--cyan)}
#app{display:flex;height:100vh;height:100dvh}
/* ---- Sidebar ---- */
#sidebar{width:320px;background:var(--panel);border-right:4px solid var(--border);display:flex;flex-direction:column;z-index:1000}
#sidebar header{padding:14px;border-bottom:4px solid var(--border);background:var(--panel2)}
#sidebar header h1{font-size:13px;color:var(--yellow);text-shadow:2px 2px 0 var(--border)}
#sidebar header p{font-size:8px;color:var(--cyan);margin-top:6px}
#tabs{display:flex;border-bottom:4px solid var(--border)}
#tabs button{flex:1;border:none;box-shadow:none;padding:12px 4px;font-size:9px;background:var(--panel2);color:var(--ink)}
#tabs button.active{background:var(--yellow);color:#000}
.tab-content{flex:1;overflow-y:auto;padding:12px;display:none}
.tab-content.active{display:block}
.tab-content::-webkit-scrollbar{width:12px}
.tab-content::-webkit-scrollbar-thumb{background:var(--panel2);border:3px solid var(--border)}
.card{background:var(--panel2);border:3px solid var(--border);padding:10px;margin-bottom:10px;box-shadow:3px 3px 0 var(--border)}
.card h3{font-size:10px;color:var(--yellow);margin-bottom:6px;word-break:break-all}
.card .meta{font-size:8px;color:var(--cyan)}
.card .desc{font-size:8px;margin-top:6px;color:var(--ink);word-break:break-word}
.card .btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.card .btns button{padding:6px 8px;font-size:8px}
.dot{display:inline-block;width:10px;height:10px;border:2px solid var(--border);margin-right:6px;vertical-align:middle}
.chip{display:inline-flex;align-items:center;cursor:pointer;background:var(--bg);border:3px solid var(--border);padding:5px 8px;margin:0 6px 8px 0;font-size:8px;user-select:none}
.chip.off{opacity:.4}
.empty{color:var(--mag);font-size:9px;text-align:center;padding:20px 10px}
/* ---- Map ---- */
#map{flex:1;background:var(--bg)}
.leaflet-container{font-family:'Press Start 2P',monospace;font-size:9px}
.leaflet-popup-content-wrapper{background:var(--panel);color:var(--ink);border:3px solid var(--border);border-radius:0;box-shadow:4px 4px 0 var(--border)}
.leaflet-popup-tip{background:var(--panel);border:3px solid var(--border);border-radius:0}
.leaflet-popup-content{margin:12px;line-height:1.8}
.leaflet-popup-content b{color:var(--yellow);font-size:10px}
.leaflet-popup-content .pd{color:var(--cyan);font-size:8px}
.leaflet-bar a{background:var(--panel2)!important;color:var(--ink)!important;border:3px solid var(--border)!important;border-radius:0!important;font-family:inherit}
.leaflet-control-attribution{font-size:7px!important;background:rgba(0,0,0,.7)!important;color:#888!important}
.leaflet-control-attribution a{color:var(--cyan)!important}
.marker-pixel{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border:3px solid #000;font-size:11px}
#mapBtns{position:absolute;top:12px;right:12px;z-index:900;display:flex;flex-direction:column;gap:8px}
#mapBtns button{width:52px;height:52px;font-size:18px;padding:0;background:var(--yellow);color:#000}
#mapBtns button.danger{background:var(--red)}
#statusBar{position:absolute;left:12px;bottom:12px;z-index:900;background:var(--panel2);border:3px solid var(--border);padding:6px 10px;font-size:8px;color:var(--green);box-shadow:3px 3px 0 var(--border)}
/* ---- Mobile ---- */
#menuToggle{display:none;position:absolute;top:12px;left:12px;z-index:1100;width:52px;height:52px;font-size:16px;background:var(--green);color:#000}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:990}
@media(max-width:768px){
  #sidebar{position:fixed;left:0;top:0;bottom:0;width:300px;transform:translateX(-105%);transition:transform .2s steps(6);border-right:none}
  #sidebar.open{transform:translateX(0)}
  #overlay.show{display:block}
  #menuToggle{display:block}
  body{font-size:10px}
  .tab-content{padding:10px}
}
/* ---- Modal ---- */
#modalBg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:2000;align-items:center;justify-content:center;padding:16px}
#modalBg.show{display:flex}
#modal{background:var(--panel);border:4px solid var(--border);box-shadow:6px 6px 0 var(--border);width:100%;max-width:420px;max-height:85vh;overflow-y:auto;padding:16px}
#modal h2{font-size:11px;color:var(--yellow);margin-bottom:14px}
label{display:block;font-size:8px;color:var(--cyan);margin-bottom:4px;margin-top:8px}
.colorRow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.colorSwatch{width:28px;height:28px;border:3px solid var(--border);cursor:pointer}
.colorSwatch.sel{outline:3px solid #fff}
.rowBtns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:3px solid var(--border);color:var(--green);padding:10px 16px;font-size:9px;z-index:3000;box-shadow:4px 4px 0 var(--border);display:none}
</style>
</head>
<body>
<div id="app">
  <button id="menuToggle">☰</button>
  <div id="overlay"></div>

  <aside id="sidebar">
    <header>
      <h1>👾 8-BIT TRAVEL</h1>
      <p id="storageInfo">CHECKING STORAGE...</p>
    </header>
    <div id="tabs">
      <button data-tab="places" class="active">地點</button>
      <button data-tab="cats">分類</button>
      <button data-tab="data">資料</button>
    </div>

    <!-- 地點清單 -->
    <div id="tab-places" class="tab-content active">
      <div style="margin-bottom:10px">
        <input id="searchBox" placeholder="🔍 搜尋地點...">
      </div>
      <div style="margin-bottom:10px">
        <button class="primary" style="width:100%" onclick="UI.startAddPlace()">＋ 新增地點</button>
      </div>
      <div id="filterChips"></div>
      <div id="placeList"></div>
    </div>

    <!-- 分類管理 -->
    <div id="tab-cats" class="tab-content">
      <button class="primary" style="width:100%;margin-bottom:12px" onclick="UI.openCatModal()">＋ 新增分類</button>
      <div id="catList"></div>
    </div>

    <!-- 資料匯入匯出 -->
    <div id="tab-data" class="tab-content">
      <div class="card">
        <h3>💾 儲存狀態</h3>
        <p style="font-size:8px" id="dbInfo"></p>
      </div>
      <div class="card">
        <h3>📤 匯出 JSON</h3>
        <p style="font-size:8px;margin-bottom:10px">下載所有地點與分類資料。</p>
        <button class="primary" style="width:100%" onclick="Data.exportJSON()">匯出檔案</button>
      </div>
      <div class="card">
        <h3>📥 匯入 JSON</h3>
        <p style="font-size:8px;margin-bottom:10px">選擇 JSON 檔案匯入（可選合併或覆蓋）。</p>
        <button style="width:100%;margin-bottom:8px" onclick="UI.askImportMode('merge')">合併匯入</button>
        <button class="danger" style="width:100%" onclick="UI.askImportMode('replace')">覆蓋匯入</button>
        <input type="file" id="importFile" accept=".json" style="display:none">
      </div>
      <div class="card">
        <h3>🗑️ 危險區域</h3>
        <button class="danger" style="width:100%" onclick="UI.askClearAll()">清空所有資料</button>
      </div>
    </div>
  </aside>

  <main id="map">
    <div id="mapBtns">
      <button title="定位目前位置" onclick="Geo.locate()">🎯</button>
      <button class="danger" title="取消新增模式" id="cancelAddBtn" style="display:none" onclick="UI.cancelAdd()">✕</button>
    </div>
    <div id="statusBar">READY</div>
  </main>
</div>

<!-- Modal -->
<div id="modalBg">
  <div id="modal">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div class="rowBtns">
      <button onclick="UI.closeModal()">取消</button>
      <button class="primary" id="modalOk">確定</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ============ IndexedDB ============ */
const DB = {
  db:null,
  open(){
    return new Promise((res,rej)=>{
      const r=indexedDB.open('travelMap8bit',1);
      r.onupgradeneeded=e=>{
        const d=e.target.result;
        if(!d.objectStoreNames.contains('places')){
          const s=d.createObjectStore('places',{keyPath:'id'});
          s.createIndex('cat','cat');
        }
        if(!d.objectStoreNames.contains('cats')){
          const s=d.createObjectStore('cats',{keyPath:'id'});
        }
      };
      r.onsuccess=()=>{DB.db=r.result;res()};
      r.onerror=()=>rej(r.error);
    });
  },
  tx(store,mode){return DB.db.transaction(store,mode).objectStore(store)},
  getAll(store){return new Promise((res,rej)=>{const r=DB.tx(store,'readonly').getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  put(store,val){return new Promise((res,rej)=>{const r=DB.tx(store,'readwrite').put(val);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  del(store,id){return new Promise((res,rej)=>{const r=DB.tx(store,'readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})},
  clear(store){return new Promise((res,rej)=>{const r=DB.tx(store,'readwrite').clear();r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
};

/* ============ State ============ */
const State = {
  places:[], cats:[],
  filter:new Set(),        // 關閉的分類 id
  addMode:false,
  markers:new Map()        // placeId -> marker
};

const DEFAULT_CATS = [
  {id:'cat_sight', name:'景點', color:'#ffd93d', icon:'📸'},
  {id:'cat_food',  name:'美食', color:'#ff6ec7', icon:'🍜'},
  {id:'cat_hotel', name:'住宿', color:'#5ce1e6', icon:'🛏️'},
  {id:'cat_trans', name:'交通', color:'#4ade80', icon:'🚌'}
];
const PALETTE=['#ffd93d','#ff6ec7','#5ce1e6','#4ade80','#ff5c5c','#a78bfa','#fb923c','#f472b6','#34d399','#60a5fa'];
const CAT_ICONS=['📸','🍜','🛏️','🚌','🛍️','🎪','🏖️','⛰️','🏛️','⛲','🎡','🍺','☕','🎁','🚆','✈️'];

/* ============ Toast ============ */
function toast(msg,ms=2200){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.display='block';
  clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',ms);
}
function status(msg){
  const s=document.getElementById('statusBar');
  s.textContent=msg;s.style.color='var(--green)';
}

/* ============ Map ============ */
const Map = {
  map:null, meMarker:null,
  init(){
    Map.map=L.map('map',{
      zoomControl:true,
      worldCopyJump:true
    }).setView([23.7,120.96],7); // 台灣
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      maxZoom:19,
      attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(Map.map);
    Map.map.on('click',e=>{
      if(State.addMode){
        UI.openPlaceModal(null,{lat:e.latlng.lat,lng:e.latlng.lng});
        UI.cancelAdd();
      }
    });
    // 響應式：尺寸變更時重繪
    window.addEventListener('resize',()=>setTimeout(()=>Map.map.invalidateSize(),250));
    if(window.innerWidth>768) document.getElementById('menuToggle').style.display='none';
  },
  makeIcon(color,icon){
    return L.divIcon({
      className:'',
      html:`<div class="marker-pixel" style="background:${color}">${icon||'📍'}</div>`,
      iconSize:[22,22], iconAnchor:[11,11], popupAnchor:[0,-14]
    });
  },
  catOf(id){return State.cats.find(c=>c.id===id)},
  refreshMarkers(){
    State.markers.forEach(m=>Map.map.removeLayer(m));
    State.markers.clear();
    State.places.forEach(p=>{
      if(State.filter.has(p.cat))return;
      const c=Map.catOf(p.cat)||{color:'#ffd93d',icon:'📍',name:'未分類'};
      const m=L.marker([p.lat,p.lng],{icon:Map.makeIcon(c.color,c.icon)}).addTo(Map.map);
      m.bindPopup(
        `<b>${esc(p.name)}</b><br>`+
        `<span class="pd"><span style="color:${c.color}">■</span> ${esc(c.name)}</span><br>`+
        (p.desc?`<span class="pd">${esc(p.desc)}</span><br>`:'')+
        `<span class="pd">📍 ${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</span>`
      );
      m.on('click',()=>{ if(window.innerWidth<=768) UI.closeSidebar(); });
      State.markers.set(p.id,m);
    });
  }
};

/* ============ Geo ============ */
const Geo = {
  locate(){
    if(!navigator.geolocation){toast('此瀏覽器不支援定位');return}
    status('定位中...');
    navigator.geolocation.getCurrentPosition(pos=>{
      const {latitude:lat,longitude:lng}=pos.coords;
      if(Map.meMarker)Map.map.removeLayer(Map.meMarker);
      Map.meMarker=L.marker([lat,lng],{icon:Map.makeIcon('#ff5c5c','👤')})
        .addTo(Map.map).bindPopup('<b>你的位置</b>');
      Map.map.setView([lat,lng],15);
      status('已定位');
      toast('🎯 已定位目前位置');
    },err=>{
      status('定位失敗');
      toast('定位失敗：'+err.message);
    },{enableHighAccuracy:true,timeout:10000});
  }
};

/* ============ Data (import/export) ============ */
const Data = {
  async exportJSON(){
    const payload={
      app:'travel-map-8bit',version:1,exportedAt:new Date().toISOString(),
      cats:State.cats,places:State.places
    };
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`travel-map-${new Date().toISOString().slice(0,10)}.json`;
    a.click();URL.revokeObjectURL(a.href);
    toast('📤 已匯出 JSON');
  },
  async importJSON(file,mode){
    try{
      const data=JSON.parse(await file.text());
      if(!data.places||!data.cats)throw new Error('格式不符');
      if(mode==='replace'){
        await DB.clear('places');await DB.clear('cats');
        State.cats=[];State.places=[];
      }
      // 分類先匯入（避免重複 id）
      const catIds=new Set(State.cats.map(c=>c.id));
      for(const c of data.cats){ if(!catIds.has(c.id)){await DB.put('cats',c);State.cats.push(c);catIds.add(c.id);} }
      const placeIds=new Set(State.places.map(p=>p.id));
      for(const p of data.places){
        if(!p.id||typeof p.lat!=='number')continue;
        if(!placeIds.has(p.id)){await DB.put('places',p);State.places.push(p);placeIds.add(p.id);}
      }
      UI.renderAll();
      toast(`📥 匯入完成（${mode==='replace'?'覆蓋':'合併'}）`);
    }catch(e){ toast('匯入失敗：'+e.message); }
  }
};

/* ============ UI ============ */
const UI = {
  // --- Modal ---
  openModal(title,bodyHTML,onOk){
    document.getElementById('modalTitle').textContent=title;
    document.getElementById('modalBody').innerHTML=bodyHTML;
    document.getElementById('modalBg').classList.add('show');
    document.getElementById('modalOk').onclick=onOk;
  },
  closeModal(){document.getElementById('modalBg').classList.remove('show')},

  // --- Sidebar ---
  closeSidebar(){
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('show');
  },

  // --- 新增地點流程 ---
  startAddPlace(){
    State.addMode=true;
    document.getElementById('cancelAddBtn').style.display='block';
    status('點擊地圖放置地點');
    toast('點擊地圖以新增地點');
    UI.closeSidebar();
  },
  cancelAdd(){
    State.addMode=false;
    document.getElementById('cancelAddBtn').style.display='none';
    status('READY');
  },
  openPlaceModal(existing,coords){
    const p=existing||{name:'',cat:State.cats[0]?.id||'',desc:'',lat:coords.lat,lng:coords.lng};
    const opts=State.cats.map(c=>
      `<option value="${c.id}" ${c.id===p.cat?'selected':''}>${c.icon} ${esc(c.name)}</option>`).join('');
    UI.openModal(existing?'✏️ 編編輯地點':'➕ 新增地點',`
      <label>名稱 *</label>
      <input id="f_name" value="${esc(p.name)}" maxlength="60">
      <label>分類</label>
      <select id="f_cat">${opts}</select>
      <label>描述</label>
      <textarea id="f_desc" rows="3">${esc(p.desc||'')}</textarea>
      <label>座標</label>
      <input id="f_lat" type="number" step="any" value="${p.lat}">
      <input id="f_lng" type="number" step="any" value="${p.lng}">
    `,async()=>{
      const name=document.getElementById('f_name').value.trim();
      if(!name){toast('請輸入名稱');return}
      const lat=parseFloat(document.getElementById('f_lat').value);
      const lng=parseFloat(document.getElementById('f_lng').value);
      if(isNaN(lat)||isNaN(lng)){toast('座標無效');return}
      const obj=existing?{...p,...{}}:{id:'p_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),created:Date.now()};
      obj.name=name;
      obj.cat=document.getElementById('f_cat').value;
      obj.desc=document.getElementById('f_desc').value.trim();
      obj.lat=lat;obj.lng=lng;
      await DB.put('places',obj);
      if(existing){const i=State.places.findIndex(x=>x.id===p.id);State.places[i]=obj}
      else State.places.push(obj);
      UI.closeModal();UI.renderAll();
      Map.map.setView([lat,lng],Math.max(Map.map.getZoom(),13));
      toast(existing?'✏️ 已更新':'➕ 已新增：'+name);
    });
  },
  async deletePlace(id){
    if(!confirm('確定刪除此地點？'))return;
    await DB.del('places',id);
    State.places=State.places.filter(p=>p.id!==id);
    UI.renderAll();toast('🗑️ 已刪除');
  },
  flyTo(p){ Map.map.setView([p.lat,p.lng],15); UI.closeSidebar(); },

  // --- 分類 Modal ---
  openCatModal(existing){
    const c=existing||{name:'',color:PALETTE[0],icon:CAT_ICONS[0]};
    const colors=PALETTE.map(col=>
      `<div class="colorSwatch ${col===c.color?'sel':''}" data-c="${col}" style="background:${col}"></div>`).join('');
    const icons=CAT_ICONS.map(ic=>
      `<button type="button" class="chip ${ic===c.icon?'':'off'}" data-i="${ic}" style="font-size:14px">${ic}</button>`).join('');
    UI.openModal(existing?'✏️ 編輯分類':'➕ 新增分類',`
      <label>分類名稱 *</label>
      <input id="c_name" value="${esc(c.name)}" maxlength="20">
      <label>顏色</label>
      <div class="colorRow" id="c_colors">${colors}</div>
      <label>圖示</label>
      <div id="c_icons">${icons}</div>
      ${existing?`<p style="font-size:8px;color:var(--mag);margin-top:10px">⚠️ 刪除分類將同時刪除該分類所有地點</p>`:''}
    `,async()=>{
      const name=document.getElementById('c_name').value.trim();
      if(!name){toast('請輸入名稱');return}
      const color=document.querySelector('#c_colors .sel')?.dataset.c||PALETTE[0];
      const icon=document.querySelector('#c_icons .chip:not(.off)')?.dataset.i||CAT_ICONS[0];
      const obj=existing?{...c}:{id:'cat_'+Date.now()};
      obj.name=name;obj.color=color;obj.icon=icon;
      await DB.put('cats',obj);
      if(existing){const i=State.cats.findIndex(x=>x.id===c.id);State.cats[i]=obj}
      else State.cats.push(obj);
      UI.closeModal();UI.renderAll();toast('✅ 已儲存分類');
    });
    document.querySelectorAll('#c_colors .colorSwatch').forEach(el=>el.onclick=()=>{
      document.querySelectorAll('#c_colors .colorSwatch').forEach(x=>x.classList.remove('sel'));
      el.classList.add('sel');
    });
    document.querySelectorAll('#c_icons .chip').forEach(el=>el.onclick=()=>{
      document.querySelectorAll('#c_icons .chip').forEach(x=>x.classList.add('off'));
      el.classList.remove('off');
    });
  },
  async deleteCat(id){
    const n=State.places.filter(p=>p.cat===id).length;
    if(!confirm(`刪除此分類${n?`及其 ${n} 個地點`:''}？`))return;
    await DB.del('cats',id);
    for(const p of State.places.filter(p=>p.cat===id))await DB.del('places',p.id);
    State.cats=State.cats.filter(c=>c.id!==id);
    State.places=State.places.filter(p=>p.cat!==id);
    State.filter.delete(id);
    UI.renderAll();toast('🗑️ 已刪除分類');
  },

  // --- 匯入/清除 ---
  askImportMode(mode){
    const file=document.getElementById('importFile');
    file.onchange=()=>{
      if(file.files[0])Data.importJSON(file.files[0],mode);
      file.value='';
    };
    file.click();
  },
  async askClearAll(){
    if(!confirm('確定清空所有地點與分類？此操作無法復原！'))return;
    await DB.clear('places');await DB.clear('cats');
    State.places=[];State.cats=[];State.filter.clear();
    await seedDefaults();
    UI.renderAll();toast('已清空並重設預設分類');
  },

  // --- Render ---
  renderAll(){UI.renderChips();UI.renderPlaces();UI.renderCats();UI.renderDbInfo();Map.refreshMarkers()},

  renderChips(){
    const box=document.getElementById('filterChips');
    if(!State.cats.length){box.innerHTML='';return}
    box.innerHTML=State.cats.map(c=>
      `<span class="chip ${State.filter.has(c.id)?'off':''}" data-id="${c.id}">
        <span class="dot" style="background:${c.color}"></span>${c.icon} ${esc(c.name)}</span>`).join('');
    box.querySelectorAll('.chip').forEach(el=>el.onclick=()=>{
      const id=el.dataset.id;
      State.filter.has(id)?State.filter.delete(id):State.filter.add(id);
      UI.renderChips();Map.refreshMarkers();
    });
  },

  renderPlaces(){
    const list=document.getElementById('placeList');
    const q=document.getElementById('searchBox').value.trim().toLowerCase();
    let ps=State.places.filter(p=>!State.filter.has(p.cat));
    if(q)ps=ps.filter(p=>p.name.toLowerCase().includes(q)||(p.desc||'').toLowerCase().includes(q));
    if(!ps.length){list.innerHTML='<div class="empty">-- 無資料 --<br>點地圖或按「＋ 新增地點」！</div>';return}
    list.innerHTML=ps.map(p=>{
      const c=Map.catOf(p.cat)||{color:'#ffd93d',icon:'📍',name:'未分類'};
      return `<div class="card">
        <h3><span class="dot" style="background:${c.color}"></span>${esc(p.name)}</h3>
        <div class="meta">${c.icon} ${esc(c.name)} | ${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}</div>
        ${p.desc?`<div class="desc">${esc(p.desc)}</div>`:''}
        <div class="btns">
          <button onclick='UI.flyTo(${JSON.stringify(p)})'>🗺️</button>
          <button onclick='UI.openPlaceModal(${JSON.stringify(p)})'>✏️</button>
          <button class="danger" onclick='UI.deletePlace("${p.id}")'>🗑️</button>
        </div></div>`;
    }).join('');
  },

  renderCats(){
    const list=document.getElementById('catList');
    if(!State.cats.length){list.innerHTML='<div class="empty">-- 無分類 --</div>';return}
    list.innerHTML=State.cats.map(c=>{
      const n=State.places.filter(p=>p.cat===c.id).length;
      return `<div class="card">
        <h3><span class="dot" style="background:${c.color}"></span>${c.icon} ${esc(c.name)}</h3>
        <div class="meta">${n} 個地點</div>
        <div class="btns">
          <button onclick='UI.openCatModal(${JSON.stringify(c)})'>✏️</button>
          <button class="danger" onclick='UI.deleteCat("${c.id}")'>🗑️</button>
        </div></div>`;
    }).join('');
  },

  async renderDbInfo(){
    const persisted=await navigator.storage?.persisted?.();
    let quota='';
    if(navigator.storage?.estimate){
      const e=await navigator.storage.estimate();
      if(e.usage)quota=` | 已用 ${(e.usage/1024).toFixed(1)} KB`;
    }
    document.getElementById('dbInfo').innerHTML=
      `IndexedDB：${State.places.length} 地點 / ${State.cats.length} 分類<br>`+
      `持久化：${persisted?'✅ 已授權':'⏳ 未授權'}${quota}`;
  }
};

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

/* ============ 啟動 ============ */
async function seedDefaults(){
  if((await DB.getAll('cats')).length===0){
    for(const c of DEFAULT_CATS)await DB.put('cats',c);
  }
}
async function init(){
  // 1. 申請持久化儲存
  const info=document.getElementById('storageInfo');
  if(navigator.storage?.persist){
    const granted=await navigator.storage.persist();
    info.textContent=granted?'💾 STORAGE: PERSISTED ✓':'💾 STORAGE: BEST-EFFORT';
  }else info.textContent='💾 STORAGE: N/A';

  await DB.open();
  await seedDefaults();
  State.cats=await DB.getAll('cats');
  State.places=await DB.getAll('places');

  Map.init();
  UI.renderAll();

  // Tabs
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('tab-'+b.dataset.tab).classList.add('active');
  });
  // 搜尋
  document.getElementById('searchBox').oninput=()=>UI.renderPlaces();
  // Mobile toggle
  document.getElementById('menuToggle').onclick=()=>{
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('show');
  };
  document.getElementById('overlay').onclick=UI.closeSidebar;
  // Modal 背景關閉
  document.getElementById('modalBg').onclick=e=>{if(e.target.id==='modalBg')UI.closeModal()};
  document.addEventListener('keydown',e=>{if(e.key==='Escape')UI.closeModal()});
  status('READY ▸ '+State.places.length+' 地點');
}
init();
</script>
</body>
</html>
