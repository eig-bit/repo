<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<title>🗺️ TRAVEL MAP 8-BIT</title>

<!-- ============ 技術說明 ============
  架構:
  1. Leaflet.js 1.9.4 (CDN) - 互動地圖庫，使用 OpenStreetMap 圖層 (免費)
  2. IndexedDB - 瀏覽器內建資料庫，儲存 spots / categories / countries 三個 store
  3. navigator.storage.persist() - 向瀏覽器申請持久化儲存，
     避免瀏覽器在空間不足時自動清除 IndexedDB 資料
  4. JSON 匯入/匯出 - 將全部資料打包成 Blob 下載 / FileReader 讀入
  5. Add to Home Screen - 偵測 iOS standalone / Android beforeinstallprompt
  6. 8-bit 風格 - "Press Start 2P" 像素字體 + image-rendering: pixelated
     + 硬邊框 + 無圓角 + 方塊按鈕 + CSS 像素陰影
  部署: 直接放到 GitHub 上用 GitHub Pages (Settings -> Pages) 即可
================================= -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
:root{
  --bg:#1a1a2e; --panel:#16213e; --panel2:#0f3460;
  --accent:#e94560; --accent2:#ffd32a; --ok:#00b894;
  --text:#eee; --border:3px solid #000;
  --fs:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Press Start 2P',monospace; font-size:var(--fs);
  background:var(--bg); color:var(--text); overflow:hidden;
  image-rendering:pixelated;
}

/* ===== 像素邊框工具 ===== */
.px{border:var(--border); box-shadow:4px 4px 0 #000;}
.px-btn{
  border:var(--border); box-shadow:3px 3px 0 #000;
  background:var(--panel2); color:var(--text); cursor:pointer;
  padding:8px 10px; font-family:inherit; font-size:var(--fs);
  text-transform:uppercase; transition:transform .05s;
}
.px-btn:hover{background:#28518f}
.px-btn:active{transform:translate(3px,3px); box-shadow:0 0 0 #000}
.px-btn.danger{background:var(--accent)}
.px-btn.ok{background:var(--ok); color:#000}

/* ===== 頂欄 ===== */
#topbar{
  height:52px; display:flex; align-items:center; gap:8px;
  background:var(--panel); border-bottom:var(--border); padding:0 10px;
  position:relative; z-index:1001; flex-wrap:wrap;
}
#topbar h1{font-size:12px; color:var(--accent2); text-shadow:2px 2px 0 #000; margin-right:auto}
#topbar .px-btn{padding:6px 8px; font-size:8px}

/* ===== 主佈局 ===== */
#main{display:flex; height:calc(100vh - 52px); position:relative}
#sidebar{
  width:320px; background:var(--panel); border-right:var(--border);
  display:flex; flex-direction:column; z-index:1000;
}
#map{flex:1; z-index:1; background:#222}

/* ===== 側欄 ===== */
#filters{padding:10px; border-bottom:var(--border); background:var(--panel2)}
#filters label{display:block; margin:8px 0 4px; color:var(--accent2); font-size:8px}
#filters select{
  width:100%; background:var(--bg); color:var(--text);
  border:var(--border); font-family:inherit; font-size:var(--fs); padding:6px;
}
#spotlist{flex:1; overflow-y:auto; padding:8px}
#spotlist::-webkit-scrollbar{width:8px}
#spotlist::-webkit-scrollbar-thumb{background:var(--accent)}

.spot-item{
  border:var(--border); background:var(--bg); margin-bottom:8px;
  padding:8px; cursor:pointer; position:relative;
}
.spot-item:hover{background:#252540}
.spot-item .name{color:var(--accent2); margin-bottom:4px}
.spot-item .meta{font-size:8px; color:#9ab; line-height:1.6}
.spot-item .tag{
  display:inline-block; border:2px solid #000; padding:2px 4px;
  font-size:7px; margin-top:4px; color:#000; text-transform:uppercase;
}
#sidebar-footer{padding:10px; border-top:var(--border); display:flex; gap:6px; flex-wrap:wrap}

/* ===== 視窗 ===== */
#overlay{
  display:none; position:fixed; inset:0; background:rgba(0,0,0,.75);
  z-index:2000; align-items:center; justify-content:center; padding:16px;
}
#overlay.show{display:flex}
.modal{
  background:var(--panel); border:var(--border); box-shadow:6px 6px 0 #000;
  max-width:520px; width:100%; max-height:85vh; overflow-y:auto; padding:16px;
}
.modal h2{color:var(--accent2); font-size:12px; margin-bottom:12px; text-shadow:2px 2px 0 #000}
.modal .field{margin-bottom:10px}
.modal label{display:block; color:var(--accent2); font-size:8px; margin-bottom:4px}
.modal input, .modal textarea, .modal select{
  width:100%; background:var(--bg); color:var(--text); border:var(--border);
  font-family:inherit; font-size:var(--fs); padding:8px;
}
.modal textarea{height:70px; resize:vertical}
.modal .row{display:flex; gap:8px}
.modal .row .field{flex:1}
.modal .actions{display:flex; gap:8px; margin-top:14px; justify-content:flex-end; flex-wrap:wrap}

.mgr-item{
  display:flex; align-items:center; gap:8px; border:2px solid #000;
  background:var(--bg); padding:6px 8px; margin-bottom:6px;
}
.mgr-item .cname{flex:1; word-break:break-all}
.mgr-item input[type=color]{
  width:34px; height:26px; border:2px solid #000; padding:0; background:none; cursor:pointer;
}
.mgr-item .mini{
  border:2px solid #000; box-shadow:2px 2px 0 #000; cursor:pointer;
  font-family:inherit; font-size:7px; padding:4px 6px; background:var(--panel2); color:var(--text);
}
.mgr-item .mini.del{background:var(--accent)}
.mgr-item .mini.ed{background:var(--accent2); color:#000}

/* ===== 地圖上的按鈕 ===== */
.leaflet-control{font-family:'Press Start 2P',monospace!important}
.leaflet-bar a{
  border:2px solid #000!important; background:var(--panel)!important;
  color:var(--accent2)!important; font-family:inherit!important;
}
#locateBtn{
  position:absolute; bottom:20px; right:10px; z-index:800;
}
#addHereBtn{
  position:absolute; bottom:60px; right:10px; z-index:800;
}
.leaflet-popup-content{font-family:'Press Start 2P',monospace; font-size:9px; margin:10px}
.leaflet-popup-content-wrapper{border:var(--border); box-shadow:4px 4px 0 #000; background:var(--panel); color:var(--text)}
.leaflet-popup-tip{background:var(--panel); border:2px solid #000}
.leaflet-popup-content .pbtn{
  border:2px solid #000; box-shadow:2px 2px 0 #000; cursor:pointer;
  font-family:inherit; font-size:8px; padding:4px 6px; background:var(--panel2); color:var(--text); margin:2px 2px 0 0;
}
.leaflet-popup-content .pbtn.del{background:var(--accent)}
.popup-title{color:var(--accent2); margin-bottom:6px}

/* ===== A2HS 提示 ===== */
#a2hs{
  display:none; position:fixed; bottom:0; left:0; right:0; z-index:3000;
  background:var(--panel); border-top:var(--border); padding:12px;
  text-align:center; font-size:8px; line-height:1.8;
}
#a2hs.show{display:block}
#a2hs .px-btn{margin:0 4px}

/* ===== toast ===== */
#toast{
  position:fixed; top:60px; left:50%; transform:translateX(-50%);
  background:var(--panel); border:var(--border); box-shadow:4px 4px 0 #000;
  padding:10px 14px; z-index:3000; display:none; font-size:9px; color:var(--accent2);
}

/* ===== 響應式 ===== */
@media(max-width:700px){
  #sidebar{position:absolute; left:0; top:0; bottom:0; width:85%; max-width:320px;
    transform:translateX(-100%); transition:transform .2s}
  #sidebar.open{transform:translateX(0)}
  #sidebarToggle{display:block!important}
  :root{--fs:9px}
  #topbar h1{font-size:9px}
}
#sidebarToggle{display:none}
</style>
</head>
<body>

<div id="topbar">
  <button class="px-btn" id="sidebarToggle">☰</button>
  <h1>🗺️ TRAVEL MAP 8-BIT</h1>
  <button class="px-btn" id="btnAdd">+ ADD</button>
  <button class="px-btn" id="btnCat">CATEGORIES</button>
  <button class="px-btn" id="btnCountry">COUNTRIES</button>
  <button class="px-btn" id="btnExport">EXPORT</button>
  <button class="px-btn" id="btnImport">IMPORT</button>
  <input type="file" id="importFile" accept=".json" style="display:none">
</div>

<div id="main">
  <aside id="sidebar">
    <div id="filters">
      <label>⚑ FILTER BY COUNTRY</label>
      <select id="fCountry"><option value="">-- ALL --</option></select>
      <label>◆ FILTER BY CATEGORY</label>
      <select id="fCategory"><option value="">-- ALL --</option></select>
    </div>
    <div id="spotlist"></div>
    <div id="sidebar-footer">
      <button class="px-btn ok" id="btnAdd2">+ ADD SPOT</button>
      <button class="px-btn" id="btnPersist">💾 KEEP DATA</button>
      <button class="px-btn" id="btnDemo">DEMO DATA</button>
    </div>
  </aside>
  <div id="map"></div>
  <button class="px-btn" id="addHereBtn">＋MAP CENTER</button>
  <button class="px-btn" id="locateBtn">📍 LOCATE</button>
</div>

<div id="overlay"><div class="modal" id="modalBox"></div></div>
<div id="a2hs">
  📲 ADD TO HOME SCREEN!
  <button class="px-btn ok" id="a2hsYes">INSTALL</button>
  <button class="px-btn danger" id="a2hsNo">✕ LATER</button>
</div>
<div id="toast"></div>

<script>
/* =========================================================
   IndexedDB 封裝 (技術說明)
   - 三個 object store: spots(key id auto), categories(key name), countries(key name)
   - getAll / put / delete / clear 通用化
========================================================= */
const DB_NAME='travelmap8bit', DB_VER=1;
let db;

function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('spots')){
        const s=d.createObjectStore('spots',{keyPath:'id',autoIncrement:true});
        s.createIndex('cat','cat'); s.createIndex('country','country');
      }
      if(!d.objectStoreNames.contains('categories'))
        d.createObjectStore('categories',{keyPath:'name'});
      if(!d.objectStoreNames.contains('countries'))
        d.createObjectStore('countries',{keyPath:'name'});
    };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}
function tx(store,mode){return db.transaction(store,mode).objectStore(store)}
function dbAll(store){return new Promise(r=>{const q=tx(store,'readonly').getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])})}
function dbPut(store,val){return new Promise((res,rej)=>{const q=tx(store,'readwrite').put(val);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function dbDel(store,key){return new Promise(res=>{const q=tx(store,'readwrite').delete(key);q.onsuccess=()=>res()})}
function dbClear(store){return new Promise(res=>{const q=tx(store,'readwrite').clear();q.onsuccess=()=>res()})}

/* ===== 預設資料 ===== */
const DEFAULT_CATS=[
  {name:'自然',color:'#00b894'},{name:'古蹟',color:'#d63031'},
  {name:'購物',color:'#0984e3'},{name:'主題樂園',color:'#e84393'},
  {name:'機場',color:'#636e72'},{name:'宗教',color:'#fdcb6e'},
  {name:'場館',color:'#a29bfe'},{name:'娛樂',color:'#00cec9'},
  {name:'夜生活',color:'#8e44ad'},{name:'其他',color:'#b2bec3'}
];
const DEFAULT_COUNTRIES=['台灣','日本','香港','韓國','泰國','中國','美國','法國','英國'];

/* ===== 全域狀態 ===== */
let spots=[],cats=[],countries=[];
let markerLayer=L.layerGroup().addTo(map_init());
let markers={}; // id -> marker
let geoBtn=null;

/* ===== 地圖初始化 ===== */
let map;
function map_init(){
  map=L.map('map',{zoomControl:true}).setView([23.7,121],7);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19, attribution:'© OpenStreetMap'
  }).addTo(map);
  return map;
}

/* ===== 工具 ===== */
const $=id=>document.getElementById(id);
function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2200)}
function catColor(name){const c=cats.find(c=>c.name===name);return c?c.color:'#b2bec3'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

/* ===== 持久化 =====
   技術說明: navigator.storage.persist() 讓瀏覽器承諾不會在
   低空間壓力下清除本站資料（否則 IndexedDB 可能被自動清除）。 */
async function requestPersist(){
  if(!navigator.storage||!navigator.storage.persist){toast('NOT SUPPORTED');return}
  const ok=await navigator.storage.persist();
  toast(ok?'✅ STORAGE PERSISTED!':'⚠️ DENIED BY BROWSER');
}

/* ===== Add to Home Screen =====
   技術說明:
   - Android/Chrome: beforeinstallprompt 事件 → prompt()
   - iOS Safari: 無此 API，顯示手動教學文字
   - 已安裝 (display-mode: standalone) 則不顯示 */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); deferredPrompt=e; showA2HS();
});
window.addEventListener('appinstalled',()=>hideA2HS());
function showA2HS(){
  if(window.matchMedia('(display-mode: standalone)').matches)return;
  if(localStorage.getItem('a2hs_dismissed'))return;
  $('a2hs').classList.add('show');
  if(deferredPrompt){
    $('a2hs').firstChild.textContent=' 📲 INSTALL APP? ';
  }else{
    $('a2hs').firstChild.textContent=' 📲 iOS: SHARE → ADD TO HOME SCREEN ';
    $('a2hsYes').style.display='none';
  }
}
function hideA2HS(){$('a2hs').classList.remove('show')}
$('a2hsYes').onclick=async()=>{
  if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;hideA2HS();}
};
$('a2hsNo').onclick=()=>{localStorage.setItem('a2hs_dismissed','1');hideA2HS()};
setTimeout(showA2HS,3000);

/* ===== 資料渲染 ===== */
function renderFilters(){
  const fc=$('fCountry'),fk=$('fCategory');
  const cv=fc.value,kv=fk.value;
  fc.innerHTML='<option value="">-- ALL --</option>'+countries.map(c=>`<option ${c===cv?'selected':''}>${esc(c)}</option>`).join('');
  fk.innerHTML='<option value="">-- ALL --</option>'+cats.map(c=>`<option value="${esc(c.name)}" ${c.name===kv?'selected':''}>${esc(c.name)}</option>`).join('');
}
function filteredSpots(){
  const c=$('fCountry').value,k=$('fCategory').value;
  return spots.filter(s=>(!c||s.country===c)&&(!k||s.cat===k))
    .sort((a,b)=>(a.country||'').localeCompare(b.country||''));
}
function renderList(){
  const list=filteredSpots();
  $('spotlist').innerHTML=list.length?list.map(s=>`
    <div class="spot-item" data-id="${s.id}">
      <div class="name">${esc(s.name)}</div>
      <div class="meta">${esc(s.country||'—')} · ⭐${'★'.repeat(s.rating||1)}</div>
      <span class="tag" style="background:${catColor(s.cat)}">${esc(s.cat)}</span>
    </div>`).join('')
    :'<div style="padding:20px;text-align:center;color:#889">NO SPOTS...<br><br>PRESS + ADD!</div>';
  [...$('spotlist').children].forEach(el=>{
    el.onclick=()=>{const s=spots.find(x=>x.id==el.dataset.id);if(s){map.setView([s.lat,s.lng],13);openPopup(s)}};
  });
}
function renderMarkers(){
  markerLayer.clearLayers(); markers={};
  filteredSpots().forEach(s=>{
    const m=L.circleMarker([s.lat,s.lng],{
      radius:10,color:'#000',weight:3,
      fillColor:catColor(s.cat),fillOpacity:1
    });
    m.on('click',()=>openPopup(s));
    m.addTo(markerLayer); markers[s.id]=m;
  });
}
function openPopup(s){
  L.popup().setLatLng([s.lat,s.lng])
    .setContent(`
      <div class="popup-title">${esc(s.name)}</div>
      <div style="margin-bottom:6px">${esc(s.country||'—')} · ${esc(s.cat)}</div>
      ${s.rating?'<div style="margin-bottom:6px;color:#ffd32a">'+'★'.repeat(s.rating)+'</div>':''}
      ${s.note?`<div style="margin-bottom:6px;color:#9ab;word-break:break-all">${esc(s.note)}</div>`:''}
      <button class="pbtn" onclick="editSpot(${s.id})">EDIT</button>
      <button class="pbtn del" onclick="delSpot(${s.id})">DEL</button>
    `)
    .openOn(map);
}
function refreshAll(){renderFilters();renderList();renderMarkers()}

/* ===== 地點 CRUD ===== */
function spotModal(s={}){
  const isEdit=!!s.id;
  $('modalBox').innerHTML=`
    <h2>${isEdit?'✏️ EDIT SPOT':'➕ NEW SPOT'}</h2>
    <div class="field"><label>NAME *</label><input id="mName" value="${esc(s.name||'')}"></div>
    <div class="row">
      <div class="field"><label>COUNTRY</label>
        <select id="mCountry">${['',...countries].map(c=>`<option ${c===s.country?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
      <div class="field"><label>CATEGORY</label>
        <select id="mCat">${cats.map(c=>`<option value="${esc(c.name)}" ${c.name===s.cat?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>
    </div>
    <div class="row">
      <div class="field"><label>LATITUDE</label><input id="mLat" value="${s.lat??map.getCenter().lat}"></div>
      <div class="field"><label>LONGITUDE</label><input id="mLng" value="${s.lng??map.getCenter().lng}"></div>
    </div>
    <div class="field"><label>RATING (1-5)</label>
      <select id="mRating">${[0,1,2,3,4,5].map(r=>`<option value="${r}" ${r===(s.rating||0)?'selected':''}>${r?'★'.repeat(r):'-'}</option>`).join('')}</select></div>
    <div class="field"><label>NOTE</label><textarea id="mNote">${esc(s.note||'')}</textarea></div>
    <div class="actions">
      <button class="px-btn danger" onclick="closeModal()">CANCEL</button>
      <button class="px-btn ok" id="mSave">SAVE</button>
    </div>`;
  $('overlay').classList.add('show');
  $('mSave').onclick=async()=>{
    const name=$('mName').value.trim();
    if(!name)return toast('⚠️ NAME REQUIRED');
    const lat=parseFloat($('mLat').value),lng=parseFloat($('mLng').value);
    if(isNaN(lat)||isNaN(lng))return toast('⚠️ BAD LAT/LNG');
    const data={name,country:$('mCountry').value,cat:$('mCat').value,
      lat,lng,rating:+$('mRating').value,note:$('mNote').value.trim()};
    if(isEdit){await dbPut('spots',{...s,...data});toast('✅ UPDATED');}
    else{await dbPut('spots',data);toast('✅ ADDED');}
    await loadData(); closeModal();
  };
}
async function editSpot(id){const s=spots.find(x=>x.id===id);if(s)spotModal(s)}
async function delSpot(id){
  if(!confirm('DELETE THIS SPOT?'))return;
  await dbDel('spots',id);await loadData();map.closePopup();toast('🗑️ DELETED');
}

/* ===== 分類管理 ===== */
function catModal(){
  $('modalBox').innerHTML=`
    <h2>◆ CATEGORIES</h2>
    <div id="catList"></div>
    <div class="row" style="margin-top:10px">
      <div class="field"><label>NEW NAME</label><input id="newCat"></div>
      <div class="field"><label>COLOR</label><input type="color" id="newCatColor" value="#e94560"></div>
    </div>
    <div class="actions">
      <button class="px-btn ok" id="addCat">+ ADD</button>
      <button class="px-btn" onclick="closeModal()">DONE</button>
    </div>
    <div style="margin-top:8px;font-size:7px;color:#889">⚠️ DELETE ONLY IF NO SPOT USES IT</div>`;
  $('overlay').classList.add('show');
  const draw=()=>{
    $('catList').innerHTML=cats.map(c=>`
      <div class="mgr-item">
        <span style="width:16px;height:16px;border:2px solid #000;background:${c.color};display:inline-block"></span>
        <span class="cname">${esc(c.name)}</span>
        <button class="mini ed" data-ed="${esc(c.name)}">ED</button>
        <button class="mini del" data-del="${esc(c.name)}">DEL</button>
      </div>`).join('');
    $('catList').querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
      const n=b.dataset.del;
      if(spots.some(s=>s.cat===n))return toast('⚠️ IN USE BY SPOTS');
      await dbDel('categories',n);await loadData();draw();renderFilters();
      $('fCategory').value='';refreshAll();
    });
    $('catList').querySelectorAll('[data-ed]').forEach(b=>b.onclick=async()=>{
      const n=b.dataset.ed;const c=cats.find(x=>x.name===n);
      const nn=prompt('NEW NAME:',n); if(!nn||nn===n){return}
      const nc=prompt('HEX COLOR (e.g. #ff0000):',c.color)||c.color;
      await dbDel('categories',n);
      await dbPut('categories',{name:nn,color:nc});
      // 更新使用中的 spots
      for(const s of spots.filter(s=>s.cat===n)){s.cat=nn;await dbPut('spots',s)}
      await loadData();draw();refreshAll();
    });
  };
  draw();
  $('addCat').onclick=async()=>{
    const n=$('newCat').value.trim();
    if(!n)return toast('⚠️ NAME REQUIRED');
    if(cats.some(c=>c.name===n))return toast('⚠️ EXISTS');
    await dbPut('categories',{name:n,color:$('newCatColor').value});
    await loadData();draw();$('newCat').value='';toast('✅ ADDED');
  };
}

/* ===== 國家管理 ===== */
function countryModal(){
  $('modalBox').innerHTML=`
    <h2>⚑ COUNTRIES</h2>
    <div id="cList"></div>
    <div class="field" style="margin-top:10px"><label>NEW COUNTRY</label><input id="newC"></div>
    <div class="actions">
      <button class="px-btn ok" id="addC">+ ADD</button>
      <button class="px-btn" onclick="closeModal()">DONE</button>
    </div>`;
  $('overlay').classList.add('show');
  const draw=()=>{
    $('cList').innerHTML=countries.map(c=>`
      <div class="mgr-item">
        <span class="cname">${esc(c)}</span>
        <button class="mini ed" data-ed="${esc(c)}">ED</button>
        <button class="mini del" data-del="${esc(c)}">DEL</button>
      </div>`).join('');
    $('cList').querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
      const n=b.dataset.del;
      if(spots.some(s=>s.country===n))return toast('⚠️ IN USE BY SPOTS');
      await dbDel('countries',n);await loadData();draw();
      $('fCountry').value='';refreshAll();
    });
    $('cList').querySelectorAll('[data-ed]').forEach(b=>b.onclick=async()=>{
      const n=b.dataset.ed;const nn=prompt('NEW NAME:',n);if(!nn||nn===n)return;
      await dbDel('countries',n);await dbPut('countries',nn);
      for(const s of spots.filter(s=>s.country===n)){s.country=nn;await dbPut('spots',s)}
      await loadData();draw();refreshAll();
    });
  };
  draw();
  $('addC').onclick=async()=>{
    const n=$('newC').value.trim();
    if(!n)return toast('⚠️ NAME REQUIRED');
    if(countries.includes(n))return toast('⚠️ EXISTS');
    await dbPut('countries',n);await loadData();draw();$('newC').value='';toast('✅ ADDED');
  };
}

/* ===== JSON 匯出/匯入 =====
   技術說明: 匯出用 Blob + a.download 產生檔案；
   匯入用 FileReader 讀 JSON，覆蓋式寫回三個 store。 */
async function exportJSON(){
  const data={version:1,exportedAt:new Date().toISOString(),
    categories:cats,countries,spots};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='travelmap-backup.json';
  a.click();URL.revokeObjectURL(a.href);
  toast('📤 EXPORTED!');
}
async function importJSON(file){
  try{
    const data=JSON.parse(await file.text());
    if(!data.spots||!Array.isArray(data.spots))throw 0;
    if(!confirm(`IMPORT ${data.spots.length} SPOTS?\n(THIS REPLACES ALL DATA)`))return;
    await dbClear('spots');await dbClear('categories');await dbClear('countries');
    for(const c of data.categories||[])await dbPut('categories',c);
    for(const c of data.countries||[])await dbPut('countries',c);
    for(const s of data.spots)await dbPut('spots',s);
    await loadData();refreshAll();toast('📥 IMPORTED!');
  }catch(e){toast('⚠️ INVALID FILE')}
}

/* ===== 定位 =====
   技術說明: Geolocation API 需 HTTPS (GitHub Pages 符合)，
   watchPosition 持續更新藍點。 */
function startLocate(){
  if(!navigator.geolocation)return toast('⚠️ NO GEOLOCATION');
  toast('📡 LOCATING...');
  if(geoBtn)map.removeLayer(geoBtn);
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude:lat,longitude:lng}=pos.coords;
    geoBtn=L.circleMarker([lat,lng],{radius:12,color:'#000',weight:3,fillColor:'#3498db',fillOpacity:1})
      .addTo(map).bindPopup('📍 YOU ARE HERE');
    map.setView([lat,lng],14);
    toast('✅ FOUND!');
  },err=>toast('⚠️ '+err.message),{enableHighAccuracy:true});
}

/* ===== 主流程 ===== */
async function loadData(){
  spots=await dbAll('spots');
  cats=await dbAll('categories');
  countries=await dbAll('countries');
}
function closeModal(){$('overlay').classList.remove('show')}

(async function init(){
  db=await openDB();
  // 首次使用：寫入預設分類與國家
  if((await dbAll('categories')).length===0)
    for(const c of DEFAULT_CATS)await dbPut('categories',c);
  if((await dbAll('countries')).length===0)
    for(const c of DEFAULT_COUNTRIES)await dbPut('countries',c);
  await loadData();
  refreshAll();
})();
