<script>
// ==================== 全域變數 ====================
let map, db, markersLayer;
let currentLayer = 'street';
let isAddMarkerMode = false;
let mapMarkers = {};
let currentMarkers = [];
let deferredPrompt = null;
let currentTab = 'markers';

const LAYER_NAMES = { street: '街道', dark: '暗黑', light: '明亮', terrain: '地形' };
const TYPE_NAMES = { default: '場所', poi: '興趣點', star: '最愛', secret: '秘密基地' };

// ==================== 圖層定義 ====================
const layers = {
    street: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        maxZoom: 19
    }),
    dark: L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO',
        maxZoom: 19
    }),
    light: L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap &copy; CARTO',
        maxZoom: 19
    }),
    terrain: L.tileLayer('https://stamen-tiles.a.ssl.fastly.net/terrain/{z}/{x}/{y}.png', {
        attribution: 'Tiles by Stamen Design, CC BY 3.0 — Data by OpenStreetMap, CC BY SA',
        maxZoom: 18
    })
};

// ==================== IndexedDB ====================
function initDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open('PixelMapDB', 1);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => { db = request.result; resolve(db); };
        request.onupgradeneeded = (event) => {
            const database = event.target.result;
            if (!database.objectStoreNames.contains('markers')) {
                const store = database.createObjectStore('markers', { keyPath: 'id', autoIncrement: true });
                store.createIndex('lat', 'lat', { unique: false });
                store.createIndex('lng', 'lng', { unique: false });
                store.createIndex('type', 'type', { unique: false });
                store.createIndex('name', 'name', { unique: false });
            }
        };
    });
}

// ==================== 持久化儲存 ====================
async function requestPersistentStorage() {
    try {
        if (navigator.storage && navigator.storage.persist) {
            const already = await navigator.storage.persisted();
            if (already) { console.log('✓ 持久化儲存已啟用'); return true; }
            const granted = await navigator.storage.persist();
            console.log(granted ? '✓ 持久化儲存已獲准' : '✗ 持久化儲存未獲准');
            return granted;
        }
        return false;
    } catch (e) { console.warn('persist() 錯誤:', e); return false; }
}

async function checkPersistenceStatus() {
    const el = document.getElementById('persistence-status');
    if (!el) return;
    if (navigator.storage && navigator.storage.persisted) {
        const ok = await navigator.storage.persisted();
        el.textContent = ok ? '已啟用 ✓' : '未啟用 ✗';
        el.style.color = ok ? 'var(--pixel-green)' : 'var(--pixel-accent)';
    } else {
        el.textContent = '不支援';
    }
}

// ==================== 地圖初始化 ====================
function initMap() {
    map = L.map('map', {
        zoomControl: false,
        attributionControl: true,
        preferCanvas: true
    });

    const isMobile = window.innerWidth < 768;
    map.setView([25.0330, 121.5654], isMobile ? 11 : 13);

    L.control.zoom({ position: 'bottomright' }).addTo(map);
    layers.street.addTo(map);
    markersLayer = L.layerGroup().addTo(map);

    // 點擊地圖：自動填入座標並開啟彈窗
    map.on('click', (e) => {
        if (isAddMarkerMode) {
            document.getElementById('marker-lat').value = e.latlng.lat.toFixed(6);
            document.getElementById('marker-lng').value = e.latlng.lng.toFixed(6);
            exitAddMarkerMode();
            openModal('add-marker-modal');
            document.getElementById('marker-name').focus();
        }
    });

    window.addEventListener('resize', () => map.invalidateSize());
}

function toggleLayer() {
    const keys = Object.keys(layers);
    const next = keys[(keys.indexOf(currentLayer) + 1) % keys.length];
    map.removeLayer(layers[currentLayer]);
    currentLayer = next;
    layers[currentLayer].addTo(map);
    showToast('圖層: ' + LAYER_NAMES[currentLayer]);
}

// ==================== 標記圖標 ====================
function createMarkerIcon(type) {
    const colors = { default: '#e94560', poi: '#4ade80', star: '#f9d923', secret: '#f472b6' };
    const bg = colors[type] || colors.default;
    const html = `
        <div style="position:relative;width:22px;height:30px;">
            <div style="position:absolute;top:0;left:4px;width:14px;height:14px;background:${bg};border:2px solid #fff;"></div>
            <div style="position:absolute;top:14px;left:8px;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:10px solid ${bg};"></div>
            <div style="position:absolute;top:4px;left:8px;width:6px;height:6px;background:#fff;"></div>
        </div>`;
    return L.divIcon({
        className: 'pixel-marker-icon',
        html: html,
        iconSize: [22, 30],
        iconAnchor: [11, 30],
        popupAnchor: [0, -30]
    });
}

function createUserIcon() {
    return L.divIcon({
        className: 'pixel-user-icon',
        html: '<div class="user-dot"></div>',
        iconSize: [22, 22],
        iconAnchor: [11, 11]
    });
}

// ==================== 新增模式 ====================
function addMarkerMode() {
    isAddMarkerMode = true;
    document.getElementById('map').style.cursor = 'crosshair';
    showToast('點擊地圖選擇位置');
    // 若側欄開著「新增」分頁，切回「場所」列表
    if (currentTab === 'add') switchTab('markers', document.getElementById('tab-markers'));
}

function exitAddMarkerMode() {
    isAddMarkerMode = false;
    document.getElementById('map').style.cursor = '';
}

function locateUser() {
    if (!navigator.geolocation) return showToast('瀏覽器不支援定位');
    showToast('定位中...');
    navigator.geolocation.getCurrentPosition(
        (pos) => {
            const { latitude: lat, longitude: lng } = pos.coords;
            map.setView([lat, lng], 16);
            const m = L.marker([lat, lng], { icon: createUserIcon() }).addTo(map);
            m.bindPopup(`
                <div>
                    <div class="popup-title">📍 你的位置</div>
                    <div class="popup-coords">${lat.toFixed(6)}, ${lng.toFixed(6)}</div>
                </div>`).openPopup();
            setTimeout(() => map.removeLayer(m), 8000);
        },
        () => showToast('定位失敗或被拒絕'),
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
}

// ==================== 標記 CRUD（僅使用彈窗表單，ID 唯一） ====================
function saveMarker() {
    const name = document.getElementById('marker-name').value.trim();
    const desc = document.getElementById('marker-desc').value.trim();
    const lat = parseFloat(document.getElementById('marker-lat').value);
    const lng = parseFloat(document.getElementById('marker-lng').value);
    const type = document.getElementById('marker-type').value;

    if (!name) return showToast('請填寫名稱');
    if (isNaN(lat) || isNaN(lng)) return showToast('請填寫座標');
    if (lat < -90 || lat > 90 || lng < -180 || lng > 180) return showToast('座標超出範圍');

    const tx = db.transaction(['markers'], 'readwrite');
    tx.objectStore('markers').add({ name, desc, lat, lng, type, createdAt: new Date().toISOString() });
    tx.oncomplete = () => {
        showToast('場所已儲存!');
        closeModal('add-marker-modal');
        clearAddMarkerForm();
        loadMarkers();
    };
    tx.onerror = () => showToast('儲存失敗');
}

function editMarker(id) {
    const m = currentMarkers.find(m => m.id === id);
    if (!m) return;
    document.getElementById('edit-marker-id').value = m.id;
    document.getElementById('edit-marker-name').value = m.name;
    document.getElementById('edit-marker-desc').value = m.desc || '';
    document.getElementById('edit-marker-lat').value = m.lat;
    document.getElementById('edit-marker-lng').value = m.lng;
    document.getElementById('edit-marker-type').value = m.type || 'default';
    openModal('edit-marker-modal');
}

function updateMarker() {
    const id = parseInt(document.getElementById('edit-marker-id').value);
    const name = document.getElementById('edit-marker-name').value.trim();
    const desc = document.getElementById('edit-marker-desc').value.trim();
    const lat = parseFloat(document.getElementById('edit-marker-lat').value);
    const lng = parseFloat(document.getElementById('edit-marker-lng').value);
    const type = document.getElementById('edit-marker-type').value;

    if (!name || isNaN(lat) || isNaN(lng)) return showToast('請填寫名稱與座標');

    const tx = db.transaction(['markers'], 'readwrite');
    tx.objectStore('markers').put({ id, name, desc, lat, lng, type });
    tx.oncomplete = () => {
        showToast('場所已更新!');
        closeModal('edit-marker-modal');
        loadMarkers();
    };
    tx.onerror = () => showToast('更新失敗');
}

function deleteMarker(id) {
    if (!confirm('確定要刪除這個場所嗎？')) return;
    const tx = db.transaction(['markers'], 'readwrite');
    tx.objectStore('markers').delete(id);
    tx.oncomplete = () => { showToast('已刪除'); loadMarkers(); };
    tx.onerror = () => showToast('刪除失敗');
}

// ==================== 載入與渲染 ====================
function loadMarkers() {
    const tx = db.transaction(['markers'], 'readonly');
    const req = tx.objectStore('markers').getAll();
    req.onsuccess = () => {
        currentMarkers = req.result;
        renderMarkersOnMap(currentMarkers);
        if (currentTab === 'markers') renderMarkerList(currentMarkers);
    };
}

function renderMarkersOnMap(markers) {
    markersLayer.clearLayers();
    mapMarkers = {};
    markers.forEach(m => {
        const lm = L.marker([m.lat, m.lng], { icon: createMarkerIcon(m.type) }).addTo(markersLayer);
        lm.bindPopup(`
            <div>
                <div class="popup-title">${escapeHtml(m.name)}</div>
                <div class="popup-coords">📍 ${m.lat.toFixed(5)}, ${m.lng.toFixed(5)}</div>
                <div class="popup-coords">🏷️ ${TYPE_NAMES[m.type] || '場所'}</div>
                ${m.desc ? `<div class="popup-desc">${escapeHtml(m.desc)}</div>` : ''}
                <div class="popup-actions">
                    <button class="pixel-btn" onclick="editMarker(${m.id})">編輯</button>
                    <button class="pixel-btn danger" onclick="deleteMarker(${m.id})">刪除</button>
                </div>
            </div>`);
        mapMarkers[m.id] = lm;
    });
}

function renderMarkerList(markers) {
    const c = document.getElementById('sidebar-content');
    if (!markers.length) {
        c.innerHTML = '<div style="text-align:center;padding:24px;font-size:11px;line-height:1.8;">尚無場所<br>點擊「➕新增」開始探險!</div>';
        return;
    }
    c.innerHTML = markers.map(m => `
        <div class="marker-item" onclick="flyToMarker(${m.id})">
            <div class="marker-item-title">${escapeHtml(m.name)}</div>
            <div class="marker-item-coords">📍 ${m.lat.toFixed(4)}, ${m.lng.toFixed(4)}　[${TYPE_NAMES[m.type] || '場所'}]</div>
            ${m.desc ? `<div class="marker-item-desc">${escapeHtml(m.desc)}</div>` : ''}
            <div class="marker-item-actions">
                <button class="pixel-btn" onclick="event.stopPropagation();editMarker(${m.id})">編輯</button>
                <button class="pixel-btn danger" onclick="event.stopPropagation();deleteMarker(${m.id})">刪除</button>
                <button class="pixel-btn" onclick="event.stopPropagation();copyCoords(${m.lat},${m.lng})">座標</button>
            </div>
        </div>`).join('');
}

function flyToMarker(id) {
    const m = currentMarkers.find(m => m.id === id);
    if (!m) return;
    map.flyTo([m.lat, m.lng], 16, { duration: 1.2 });
    setTimeout(() => mapMarkers[id] && mapMarkers[id].openPopup(), 1300);
}

function copyCoords(lat, lng) {
    const text = `${lat}, ${lng}`;
    if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast('座標已複製!')).catch(() => showToast('複製失敗'));
    } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('座標已複製!');
    }
}

// ==================== JSON 匯入 / 匯出 ====================
function exportJSON() {
    const tx = db.transaction(['markers'], 'readonly');
    const req = tx.objectStore('markers').getAll();
    req.onsuccess = () => {
        const data = {
            app: 'pixel-map',
            version: '1.0',
            exportedAt: new Date().toISOString(),
            count: req.result.length,
            markers: req.result
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `pixel-map-${new Date().toISOString().split('T')[0]}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast(`已匯出 ${data.count} 個場所`);
    };
}

function importJSON(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = JSON.parse(e.target.result);
            const list = Array.isArray(data) ? data : data.markers;
            if (!Array.isArray(list)) throw new Error('找不到 markers 陣列');

            const valid = list.filter(m =>
                m && typeof m.name === 'string' &&
                typeof m.lat === 'number' && typeof m.lng === 'number'
            );
            if (!valid.length) throw new Error('沒有有效資料');

            if (!confirm(`即將匯入 ${valid.length} 個場所，繼續？`)) return;

            const tx = db.transaction(['markers'], 'readwrite');
            const store = tx.objectStore('markers');
            valid.forEach(m => {
                delete m.id;
                store.add({
                    name: m.name,
                    desc: typeof m.desc === 'string' ? m.desc : '',
                    lat: m.lat,
                    lng: m.lng,
                    type: ['default', 'poi', 'star', 'secret'].includes(m.type) ? m.type : 'default',
                    createdAt: m.createdAt || new Date().toISOString()
                });
            });
            tx.oncomplete = () => { showToast(`成功匯入 ${valid.length} 個場所!`); loadMarkers(); };
            tx.onerror = () => showToast('匯入失敗');
        } catch (err) {
            showToast('匯入失敗: ' + err.message);
        }
    };
    reader.readAsText(file);
    event.target.value = '';
}

// ==================== 分頁 ====================
function switchTab(tab, btn) {
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    (btn || document.getElementById('tab-' + tab)).classList.add('active');
    const c = document.getElementById('sidebar-content');

    if (tab === 'markers') {
        renderMarkerList(currentMarkers);
    } else if (tab === 'add') {
        // ★ 關鍵修正：不再產生重複 ID 的表單，只顯示說明與按鈕
        c.innerHTML = `
            <div style="padding:20px;text-align:center;font-size:11px;line-height:1.9;">
                <p style="margin-bottom:16px;">🏠 新增場所的方式：</p>
                <p style="margin-bottom:6px;color:var(--pixel-yellow);">方法一：點地圖選位置</p>
                <p style="margin-bottom:16px;font-size:10px;">按下方按鈕後，點擊地圖上的位置，<br>座標會<strong>自動填入</strong>彈窗</p>
                <button class="pixel-btn primary" onclick="addMarkerMode()">➕ 點擊地圖新增</button>
                <p style="margin-top:20px;margin-bottom:6px;color:var(--pixel-yellow);">方法二：手動輸入座標</p>
                <p style="margin-bottom:12px;font-size:10px;">直接開啟表單填寫名稱、座標</p>
                <button class="pixel-btn" onclick="openAddModal()">📝 手動填寫表單</button>
            </div>`;
    } else if (tab === 'info') {
        c.innerHTML = `
            <div class="info-section">
                <div class="info-title">📊 統計</div>
                <div class="info-row"><span class="k">場所數量</span><span class="v">${currentMarkers.length}</span></div>
                <div class="info-row"><span class="k">持久化儲存</span><span class="v" id="persistence-status">檢查中...</span></div>
                <div class="info-row"><span class="k">當前圖層</span><span class="v">${LAYER_NAMES[currentLayer]}</span></div>
            </div>
            <div class="info-section">
                <div class="info-title">🎮 使用說明</div>
                <div class="info-text">
                    1. 「➕新增」後點地圖選位置<br>
                    2. 點標記可查看 / 編輯 / 刪除<br>
                    3. 「📍定位」跳到當前位置<br>
                    4. 「🗺️圖層」循環切換底圖<br>
                    5. 「⬇/⬆」備份與還原資料<br>
                    6. 資料存在本機 IndexedDB
                </div>
            </div>
            <div class="info-section">
                <div class="info-title">⚙️ 技術</div>
                <div class="info-text">
                    Leaflet.js v1.9.4 · Canvas 渲染<br>
                    IndexedDB + navigator.storage.persist()<br>
                    JSON 匯入匯出 · Geolocation API<br>
                    響應式（768px 斷點）· 8-bit 像素風
                </div>
            </div>`;
        checkPersistenceStatus();
    }
}

// 手動開啟新增彈窗（座標留空由使用者填寫）
function openAddModal() {
    clearAddMarkerForm();
    openModal('add-marker-modal');
    document.getElementById('marker-name').focus();
}

// ==================== 彈窗 / Toast / 工具 ====================
function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }
function showTechInfo() { openModal('tech-info-modal'); }

document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', (e) => {
        if (e.target === overlay) overlay.classList.remove('active');
    });
});

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active'));
        exitAddMarkerMode();
    }
});

let toastTimer;
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, s => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[s]);
}

function clearAddMarkerForm() {
    ['marker-name', 'marker-desc', 'marker-lat', 'marker-lng'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.value = '';
    });
    const type = document.getElementById('marker-type');
    if (type) type.value = 'default';
}

// ==================== A2HS ====================
function getA2HSInstructions() {
    const ua = navigator.userAgent;
    const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (isIOS) return '請使用 <strong>Safari</strong> 開啟本頁，點擊底部「分享」按鈕 <strong>⬆</strong>，選擇「<strong>加入主畫面</strong>」。';
    if (/Android/.test(ua)) return '點擊瀏覽器右上角「<strong>⋮</strong>」選單，選擇「<strong>加入主畫面</strong>」或「<strong>安裝應用程式</strong>」。';
    return '點擊瀏覽器網址列右側的 <strong>⊕</strong> 或「安裝」圖示，即可將本站加入桌面。';
}

function initA2HS() {
    const dismissed = localStorage.getItem('a2hs-dismissed');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        if (!dismissed) showA2HSPrompt();
    });

    window.addEventListener('appinstalled', () => {
        hideA2HSPrompt(true);
        showToast('已加入主畫面! 🎉');
    });

    setTimeout(() => {
        if (!deferredPrompt && !dismissed && !window.matchMedia('(display-mode: standalone)').matches) {
            showA2HSPrompt();
        }
    }, 5000);
}

function showA2HSPrompt() {
    document.getElementById('a2hs-instructions').innerHTML = getA2HSInstructions();
    document.getElementById('a2hs-prompt').classList.add('active');
}

function hideA2HSPrompt(done) {
    document.getElementById('a2hs-prompt').classList.remove('active');
    if (deferredPrompt) deferredPrompt = null;
    localStorage.setItem('a2hs-dismissed', '1');
    if (done) showToast('太好了! 🎮');
}

// ==================== 初始化 ====================
async function init() {
    try {
        await initDB();
        await requestPersistentStorage();
        initMap();
        loadMarkers();
        switchTab('markers', document.getElementById('tab-markers'));
        initA2HS();
    } catch (err) {
        console.error('初始化失敗:', err);
        showToast('初始化失敗: ' + err.message);
    }
}

window.addEventListener('DOMContentLoaded', init);
</script>
